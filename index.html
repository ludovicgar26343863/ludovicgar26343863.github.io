<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boudine’s cook</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B6E7A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DDEEF2; --surface:#FFFFFF; --ink:#0D2A31; --muted:#4A6970; --line:#C5DCE2;
  --herb:#0B6E7A; --herb-ink:#FFFFFF; --saffron:#2A93C9; --saffron-soft:#D5EBF5;
  --alert:#B5380F; --alert-ink:#FFFFFF; --scrim:rgba(5,25,32,.45);
  --g1:#0B8291; --g2:#0B5C92; --grad:linear-gradient(135deg,#0B8291 0%,#0B5C92 100%);
  --bg-grad:linear-gradient(180deg,#EEF7F9 0%,#D6E9EF 100%); --bar:rgba(232,244,247,.9);
  --f-body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-head:'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif;
  --f-mono:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1B22; --surface:#10262E; --ink:#E4F1F4; --muted:#8FB0B8; --line:#1E3C46;
    --herb:#4CC0CC; --herb-ink:#04171B; --saffron:#5BB8E6; --saffron-soft:#123447;
    --alert:#F07444; --alert-ink:#1C0D06; --scrim:rgba(0,0,0,.6);
    --g1:#0E8C9A; --g2:#1060A0; --grad:linear-gradient(135deg,#0E8C9A 0%,#1060A0 100%);
    --bg-grad:linear-gradient(180deg,#0A1B22 0%,#0B2030 100%); --bar:rgba(10,27,36,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1B22; --surface:#10262E; --ink:#E4F1F4; --muted:#8FB0B8; --line:#1E3C46;
  --herb:#4CC0CC; --herb-ink:#04171B; --saffron:#5BB8E6; --saffron-soft:#123447;
  --alert:#F07444; --alert-ink:#1C0D06; --scrim:rgba(0,0,0,.6);
    --g1:#0E8C9A; --g2:#1060A0; --grad:linear-gradient(135deg,#0E8C9A 0%,#1060A0 100%);
    --bg-grad:linear-gradient(180deg,#0A1B22 0%,#0B2030 100%); --bar:rgba(10,27,36,.9);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:20px 18px 130px}
body[data-screen="cook"] #app{padding-bottom:170px}
h1,h2,h3{font-family:var(--f-head);line-height:1.08;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:17px;text-align:center}
.btn.primary{background:var(--herb);color:var(--herb-ink);border-color:var(--herb)}
.btn.danger{color:var(--alert)}
.btn.ghost{background:transparent;border-color:transparent;padding:8px 10px;min-height:44px}
.btn.mini{min-height:42px;padding:6px 14px;font-size:15px;border-radius:11px}
.btn[disabled]{opacity:.4;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.iconbtn[disabled]{opacity:.35;cursor:default}
.hint{color:var(--muted);font-size:16px;margin:14px 0}
.stack{display:flex;flex-direction:column;gap:10px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sec{font-size:21px;margin:36px 0 12px}
.sub{font-size:21px;margin:26px 0 10px}

/* Accueil */
.hero{margin:18px 0 28px}
.hero h1{font-size:clamp(52px,16vw,84px);font-weight:800;letter-spacing:-.025em;line-height:.92}
.hero h1 span{display:block}
.hero h1 span:nth-child(2){padding-left:.85em}
.hero h1 span:nth-child(3){padding-left:1.7em}
.hero p{color:var(--muted);margin-top:18px;font-size:19px}
.choice{display:block;width:100%;text-align:left;padding:22px 20px;border-radius:22px;margin-bottom:14px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface)}
.choice.launch{background:var(--herb);color:var(--herb-ink);border-color:var(--herb)}
.choice strong{display:block;font-family:var(--f-head);font-size:29px;font-weight:800;line-height:1.1}
.choice span{display:block;margin-top:4px;font-size:16px;opacity:.85}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1.5px solid var(--line);cursor:pointer}
.toggle input{width:26px;height:26px;accent-color:var(--herb);flex:none}

/* Barres de titre */
.topbar{display:flex;align-items:center;gap:6px;margin:-4px -8px 16px}
.topbar h2{font-size:25px;flex:1}

/* Liste */
.search{width:100%;margin-bottom:14px}
.rrow{display:flex;align-items:center;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;padding-right:8px}
.rrow .main{flex:1;text-align:left;background:none;border:none;padding:16px;cursor:pointer;min-height:68px}
.rrow .main b{display:block;font-size:21px;line-height:1.2}
.rrow .main small{display:block;color:var(--muted);font-size:15px;margin-top:3px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}

/* Champs */
input,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{resize:vertical;min-height:64px;line-height:1.4}
input.short{max-width:120px}
.lbl{display:block;font-weight:700;font-size:15px;color:var(--muted);margin:16px 0 0}
.lbl input,.lbl textarea{margin-top:6px;font-weight:400;color:var(--ink)}
.tabs{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{flex:1;border:none;background:none;border-radius:10px;min-height:44px;font-weight:700;cursor:pointer;font-size:16px}
.tabs button[aria-pressed="true"]{background:var(--herb);color:var(--herb-ink)}
.error{background:var(--saffron-soft);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:16px}
.ingrow,.noterow{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.stepcard{border:1.5px solid var(--line);border-radius:18px;padding:14px;margin:14px 0;background:var(--surface)}
.stepcard input,.stepcard textarea{background:var(--bg)}
.sc-head{display:flex;align-items:center;gap:6px}
.sc-head .num{font-family:var(--f-head);font-weight:800;font-size:22px;flex:1}
.timeinputs{display:flex;gap:8px;align-items:center;margin-top:6px;color:var(--ink);font-weight:400}
.timeinputs input{width:84px;margin:0}
.reels{font-size:14px;color:var(--muted);margin-top:10px}
.raw{font-family:var(--f-mono);font-size:15px;line-height:1.55;min-height:58vh;margin-top:14px}
.savebar,.cookbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1.5px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
.savebar .btn{flex:1;max-width:320px}

/* Cuisson */
.cook-top{display:flex;align-items:center;gap:8px;margin:-4px -8px 0}
.mic{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:6px 14px;min-height:42px;font-weight:700;font-size:15px;cursor:pointer}
.mic .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.mic.on{border-color:var(--herb)}
.mic.on .dot{background:var(--herb);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.heard{font-size:15px;color:var(--muted);min-height:22px;margin-top:6px}
.progress{height:6px;background:var(--line);border-radius:6px;margin:12px 0 20px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--herb);border-radius:6px}
.stepno{font-family:var(--f-head);font-weight:800;font-size:18px;color:var(--muted)}
.instr{font-size:clamp(27px,7.4vw,38px);line-height:1.22;font-weight:700;margin:8px 0 18px;white-space:pre-line;font-family:var(--f-body)}
h2.instr{font-family:var(--f-head);font-weight:800}
.desc{font-size:19px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;font-size:17px}
.notebox{border-left:5px solid var(--saffron);background:var(--surface);padding:10px 14px;border-radius:0 12px 12px 0;margin:8px 0;font-size:19px}
.inglist{padding-left:24px;font-size:21px;margin:0}
.inglist li{margin:6px 0}
.timer{display:flex;align-items:center;gap:18px;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:16px;margin:16px 0}
.dial{position:relative;width:136px;height:136px;flex:none}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .track{stroke:var(--line)}
.dial .fill{stroke:var(--saffron);transition:stroke-dashoffset .25s linear}
.dial .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-weight:800;font-size:31px;font-variant-numeric:tabular-nums}
.timer.done .dial .fill{stroke:var(--alert)}
.timer .tlabel{font-size:15px;color:var(--muted);margin-bottom:10px}
.timer .ctl{display:flex;flex-wrap:wrap;gap:8px}
.past{font-size:16px;color:var(--muted);margin-top:4px}
.next{color:var(--muted);font-size:17px;margin-top:22px}
.cookbar .done-btn{flex:1;max-width:440px;min-height:66px;font-size:23px;font-family:var(--f-head);font-weight:800;border-radius:18px}
.cookbar .back-btn{min-width:66px;min-height:66px;font-size:24px;border-radius:18px}
.alarm{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;max-width:616px;margin:0 auto;background:var(--alert);color:var(--alert-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.alarm b{font-family:var(--f-head);font-size:26px;line-height:1.1}
.alarm .row2{display:flex;gap:8px}
.alarm .btn{flex:1;background:var(--alert-ink);color:var(--alert);border:none}
.notepanel{position:fixed;left:12px;right:12px;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:15;max-width:616px;margin:0 auto;background:var(--surface);border:2px solid var(--saffron);border-radius:20px;padding:16px;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.notepanel b{font-family:var(--f-head);font-size:21px}
.notepanel p{margin:8px 0;font-size:18px}
.notepanel .muted{color:var(--muted);font-size:15px}
.notepanel textarea{margin:8px 0}

/* Portions et courses */
.stepper{display:flex;align-items:center;gap:16px;margin:10px 0 6px}
.stepper output{font-family:var(--f-head);font-weight:800;font-size:46px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.stepper .unit{color:var(--muted);font-size:16px}
.iconbtn.big{width:58px;height:58px;font-size:28px;border-radius:16px}
.porhint{color:var(--muted);font-size:16px}
.totals{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin:16px 0 4px}
.totals b{font-family:var(--f-head);font-size:26px;font-weight:800}
.shoprow{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;padding:12px 14px}
.shoprow.on{border-color:var(--herb)}
.pick{display:flex;gap:12px;align-items:center;cursor:pointer}
.pick input,.shoplist input{width:24px;height:24px;accent-color:var(--herb);flex:none;margin:0;padding:0}
.pick b{display:block;font-size:19px;line-height:1.25}
.pick small{display:block;color:var(--muted);font-size:15px}
.shoprow .stepper{margin:10px 0 2px 36px;gap:12px}
.shoprow .stepper output{font-size:28px}
.shoplist{list-style:none;padding:0;margin:0}
.shoplist label{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1.5px solid var(--line);font-size:18px;cursor:pointer}
.shoplist .off span{text-decoration:line-through;color:var(--muted)}

/* Dictée, matériel */
.withmic{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
.withmic input,.withmic textarea{margin:0}
.iconbtn.rec{background:var(--alert);color:var(--alert-ink);border-color:var(--alert)}
.btn svg,.iconbtn svg{flex:none}
.chips .chiplab{font-size:14px;font-weight:700;color:var(--muted);align-self:center;margin-right:2px}
.chip.tool{border-style:dashed}
.matrow{margin:14px 0}
.matname{display:block;font-weight:700;font-size:18px;margin-bottom:6px}
.gaps{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:16px}
.gaps li{margin:3px 0}

/* Récap */
.recap-h{font-size:clamp(44px,13vw,68px);font-weight:800;letter-spacing:-.02em;margin:22px 0 10px}
.scroll{overflow-x:auto;margin:20px 0}
table.recap{width:100%;border-collapse:collapse}
.recap th,.recap td{padding:11px 6px;border-bottom:1.5px solid var(--line);text-align:left;font-size:16px;vertical-align:top}
.recap th{color:var(--muted);font-weight:700}
.recap .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.recap tfoot td{font-weight:700;border-bottom:none}

/* Feuilles et messages */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet h3{font-size:23px;margin-bottom:8px}
.sheet p{color:var(--muted);margin:6px 0}
.sheet ul{padding-left:20px}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sheet .raw{min-height:40vh;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:40;font-size:16px;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
@media (prefers-reduced-motion: reduce){.mic.on .dot{animation:none}.dial .fill{transition:none}}
/* Gestion des recettes */
.mrow{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.mrow b{display:block;font-size:19px;line-height:1.25}
.mrow small{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.mbtns{display:flex;gap:8px;margin-top:12px}
.mbtns .btn{flex:1}

/* Prix et tickets */
.tgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.tgrid .lbl{margin:0}
select{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;margin-top:6px}
.trow{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.trow.off{opacity:.45}
.thead{display:flex;gap:10px;align-items:center}
.thead input[type="checkbox"]{width:24px;height:24px;flex:none;accent-color:var(--herb);margin:0;padding:0}
.thead input[type="text"]{font-weight:700}
.mrow.warn{border-style:dashed}

/* Ticket : deux colonnes */
.tk-head{display:grid;grid-template-columns:28px 1fr 16px 1fr;gap:8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:4px 14px 6px}
.tk{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.tk.none{border-style:dashed}
.tk.off .tk-top{opacity:.45}
.tk-top{display:grid;grid-template-columns:28px 1fr 16px 1fr;gap:8px;align-items:start}
.tk-top input[type="checkbox"]{width:24px;height:24px;accent-color:var(--herb);margin:2px 0 0;padding:0}
.tk-col{min-width:0}
.tk-col b{display:block;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.tk-col span{display:block;font-size:15px;color:var(--muted);margin-top:2px}
.tk-col .muted{color:var(--muted)}
.tk-arrow{color:var(--muted);padding-top:2px}
.tk-bot{display:flex;gap:8px;align-items:center;margin-top:10px}
.tk-bot select{margin:0;flex:1;min-width:0;font-size:15px}
.tk-note{font-size:14px;color:var(--herb);margin-top:6px;font-weight:700}
.mrow small + small{margin-top:0}
.matv input{font-size:15px;padding:7px 10px;margin-top:6px}
.matv .gaps{font-size:14px;margin-top:4px}

.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
label.btn{cursor:pointer;position:relative}

/* Zones sur la photo */
.ztypes{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.ztypes button{border:2px solid var(--zc);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;min-height:42px;cursor:pointer}
.ztypes button[aria-checked="true"]{background:var(--zc);color:#fff}
.zpager{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;font-weight:700}
.zwrap{position:relative;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:12px;overflow:hidden;background:#000}
.zwrap img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.zlayer{position:absolute;inset:0}
.zbox{position:absolute;border:3px solid var(--zc);background:color-mix(in srgb, var(--zc) 18%, transparent);border-radius:4px}
.zbox.drawing{border-style:dashed}
.ztag{position:absolute;left:0;top:0;background:var(--zc);color:#fff;font-size:12px;font-weight:700;padding:1px 6px;border-radius:0 0 4px 0;white-space:nowrap;pointer-events:none}
.zdel{position:absolute;right:-1px;top:-1px;width:34px;height:34px;border:none;border-radius:0 0 0 6px;background:var(--zc);color:#fff;font-weight:700;cursor:pointer;font-size:15px}

.ver{text-align:center;color:var(--muted);font-size:13px;margin:32px 0 0;opacity:.8}

.matlist li{margin:8px 0}
.matline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn.matbtn{width:38px;height:38px;font-size:20px;border-radius:50%;flex:none}
.matprec{font-size:15px;color:var(--muted);margin-top:2px}
.chrono{display:inline-flex;align-items:center;gap:8px;font-size:16px;color:var(--muted)}
.chrono b{font-family:var(--f-head);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}

/* Thème bleu canard */
body{background:var(--bg-grad);min-height:100vh}
.btn.primary,.choice.launch,.tabs button[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}
.choice.launch span{opacity:.9}
.progress i{background:var(--grad)}
.dial .fill{stroke:url(#tgrad)}
.timer.done .dial .fill{stroke:var(--alert)}
.savebar,.cookbar{background:var(--bar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.stepper output{color:var(--herb)}
.choice:not(.launch){border-left:5px solid var(--herb)}
</style>
</head>
<body>
<main id="app"></main>
<div id="alarm-host"></div>
<div id="note-host"></div>
<script>
'use strict';
const APP_VERSION = '1.16';
const $ = s => document.querySelector(s);
const app = document.getElementById('app');

function parseDuration(v){

    const n = parseFloat(m[1]);
    let u = m[2] || (prev === 'h' ? 'min' : prev === 'min' ? 's' : 'min');
    if (u.startsWith('h')) { total += n * 3600; prev = 'h'; }
    else if (u.startsWith('s')) { total += n; prev = 's'; }

}

  if (s || !p.length) p.push(`${s} s`);

}

}

}

const UNITS = { g:['g',1], gr:['g',1], grammes:['g',1], kg:['g',1000], mg:['g',.001], l:['ml',1000], litre:['ml',1000], litres:['ml',1000], dl:['ml',100], cl:['ml',10], ml:['ml',1] };

  const m = String(txt).trim().match(/^(\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?|[½¼¾⅓⅔])\s*(.*)$/);
  if (!m) return null;
  const a = m[1]; let q;
  if (FRAC[a]) q = FRAC[a];
  else if (a.includes('/')) { const [x, y] = a.split('/').map(v => parseFloat(v.replace(',', '.'))); q = y ? x / y : x; }

  const um = rest.match(/^([a-zA-Zéè]+)\.?(?=\s|$)\s*(.*)$/);

}

const MARKERS = { 'recette':1, 'description':1, 'portions':1, 'ingredient':1, 'ingredients':1, 'etape':1, 'temps':1, 'temps reel':1, 'temps reels':1, 'note':1, 'materiel':1, 'ecart materiel':1, 'ecart':1 };
function parse(text, opts = {}){

  const append = (val) => {
    if (!last) return false;
    if (last.arr) last.arr[last.i] = (last.arr[last.i] ? last.arr[last.i] + '\n' : '') + val;
    else last.o[last.f] = (last.o[last.f] ? last.o[last.f] + '\n' : '') + val;
    return true;
  };

    const ln = idx + 1;
    if (!line.trim()) return;
    const m = line.match(/^\s*([^:]{2,24}?)\s*:\s?(.*)$/);
    const k = m ? norm(m[1]) : '';
    if (!m || !MARKERS[k]) { append(line.trim()); return; }
    const v = m[2].trim();
    if (k === 'recette') { r.titre = v; last = { o:r, f:'titre' }; }
    else if (k === 'description') { r.description = v; last = { o:r, f:'description' }; }
    else if (k === 'portions') { r.portions = parseInt(v, 10) || null; last = null; }
    else if (k === 'ingredient' || k === 'ingredients') {
      const arr = cur ? cur.ingredients : r.ingredients;
      arr.push(v); last = { arr, i: arr.length - 1 };
    }
    else if (k === 'etape') {
      cur = { instruction:v, temps:null, tempsReels:[], ingredients:[], materiel:[], notes:[] };
      r.etapes.push(cur); last = { o:cur, f:'instruction' };
    }
    else if (k === 'temps') {
      if (!cur) { last = null; return; }

      last = null;
    }
    else if (k.startsWith('temps reel')) {
      if (cur) cur.tempsReels = v.split(/[,;]/).map(parseDuration).filter(x => x != null).slice(0, 5);
      last = null;
    }
    else if (k === 'materiel') {
      const arr = cur ? cur.materiel : r.materiel;
      arr.push(v); last = { arr, i: arr.length - 1 };
    }
    else if (k.startsWith('ecart')) {
      const em = v.match(/^(.+?),\s*(.+?)\s*:\s*([+\-−]?)\s*(.+?)\s+sur\s+(\d+)\s+fois\s*$/i);
      if (em) { const d = parseDuration(em[4]) || 0; r.ecarts.push({ item:em[1].trim(), variant:em[2].trim(), avg:/[-−]/.test(em[3]) ? -d : d, n:+em[5] }); }
      last = null;
    }
    else if (k === 'note') {
      if (!cur) { last = null; return; }
      cur.notes.push(v); last = { arr:cur.notes, i:cur.notes.length - 1 };
    }

  }

}
function serialize(r){

  const gi = (r.ingredients || []).filter(x => x && x.trim());
  if (gi.length) { out.push(''); gi.forEach(x => out.push(`Ingrédient : ${x}`)); }
  const gmat = (r.materiel || []).filter(x => x && x.trim());
  if (gmat.length) { out.push(''); gmat.forEach(x => out.push(`Matériel : ${x}`)); }

}

    r.onerror = e => { out.err = e.error; fin(); };

  else if (!mic && pst === 'prompt') end('Le navigateur refuse le micro sans afficher la demande. Dans Chrome : ⋮ → Paramètres → Paramètres des sites → Tous les sites → ludovicgar26343863.github.io → « Réinitialiser les autorisations » (surtout pas « Effacer les données » : tes recettes seraient perdues). Puis relance le test et accepte la demande.');

async function micRetry(){

function updMic(){ const b = $('#mic'); if (!b) return; b.classList.toggle('on', V.state === 'on'); $('#mic-l').textContent = micLabel(); }
function setHeard(raw, miss){ const el = $('#heard'); if (el) el.textContent = miss ? `« ${raw} » : je n’ai pas compris cette commande.` : `« ${raw} »`; }

function heard(raw){
  const c = S.cook; if (!c || S.screen !== 'cook') return;
  const n = norm(raw); if (!n) return;
  setHeard(raw);
  if (c.note && c.note.mode === 'listen') {
    const stop = /fin de (la )?note/.test(n);
    const part = raw.replace(/fin de (la )?note.*$/i, '').trim();
    if (part) c.note.text = (c.note.text + ' ' + part).trim();
    if (stop) return endNoteListen();
    renderNote(); armNoteSilence(); return;
  }
  if (c.note && c.note.mode === 'review') {
    if (/\b(ok|oui|garde|valide)\b/.test(n)) { ack(); return keepNote(); }
    if (/annul|supprim|efface/.test(n)) { ack(); return cancelNote(); }
  }
  if (c.confirmEnd && Date.now() < c.confirmEnd) {
    if (/\boui\b/.test(n)) { c.confirmEnd = 0; ack(); return endCook(); }
    if (/\bnon\b/.test(n)) { c.confirmEnd = 0; return say('D’accord, on continue.', true); }
  }
  if (c.alarm && /\b(stop|ok|arrete|arreter|c'est bon)\b/.test(n)) { ack(); return stopAlarm(); }
  if (isSpeaking()) {
    if (/etape termin/.test(n)) { hush(); ack(); return finishStep(); }
    if (/\bstop\b|silence|tais-toi/.test(n)) { hush(); ack(); }
    return;
  }
  if (c.i < 0) {
    const pm = n.match(/(\d+)\s*(portion|personne|part)/);
    if (pm) { ack(); setPortions(+pm[1]); const est = Math.round(estTotal(c.r) * c.f); return say(`${plural(c.portions, 'portion')}.${est ? ` Temps total estimé : ${fmtSpeech(est)}.` : ''}`, true); }
  }
  if (c.i < 0 && /commenc|c'est parti|etape termin/.test(n)) { ack(); return goStep(0); }
  const cmds = [
    [/termine(r)? la recette|fin de la recette/, () => { c.confirmEnd = Date.now() + 8000; say('Terminer la recette ? Dis oui pour confirmer.', true); }],
    [/etape termin|etape finie/, finishStep],
    [/precedent|retour|etape d'avant/, prevStep],
    [/repete|relis|redis/, repeatStep],
    [/combien de temps|temps restant|il reste combien/, sayRemaining],
    [/ajoute une minute|une minute de plus|plus une minute/, tAdd],
    [/lance le minuteur|lance le chrono|demarre|\btop\b/, () => tStart()],
    [/reprend/, () => tStart()],
    [/\bpause\b/, tPause],
    [/mes notes|les notes|lis la note/, readNotes],
    [/^note\b|prends une note|ajoute une note|nouvelle note/, startNote],
    [/ingredient/, readIngredients],
  ];
  for (const [re, fn] of cmds) if (re.test(n)) { ack(); fn(); return; }
  setHeard(raw, true);
}

/* ---------- Mode cuisson ---------- */
function startCook(id){
  const r = find(id); if (!r) return;
  ensureAudio();
  const base = r.portions || 1;
  S.cook = { rid:id, r, i:-1, t:null, stepStart:0, results:[], alarm:false, note:null, confirmEnd:0, base, portions:base, f:1, mats:allMat(r), mat:{}, matRes:[] };
  const gmv = load(MKEY, {}); S.cook.mats.forEach(m => { S.cook.mat[m] = gmv[norm(m)] || ''; });
  S.screen = 'cook'; render(); window.scrollTo(0, 0);
  keepAwake(true);
  if (SR) { if (V.state === 'denied') { V.state = 'off'; V.err = null; } startVoice(); }
  say(`${r.titre}. Pour combien de portions ? Dis par exemple « 6 portions », puis « commencer ».`);
}
function setPortions(n){
  const c = S.cook; if (!c) return;
  c.portions = Math.max(1, Math.min(50, n)); c.f = c.portions / c.base;
  if (S.screen === 'cook' && c.i < 0) render();
}
function goStep(i){
  if (!S.cook || !S.cook.r.etapes[i]) return;
  const c = S.cook; stopAlarm(); cancelNote(true);
  c.i = i; const st = c.r.etapes[i];
  const tt = st.temps ? Math.max(1, Math.round(st.temps * c.f)) : 0;
  c.t = tt ? { base:tt, total:tt, remaining:tt, endAt:0, running:false, done:false } : null;
  c.stepStart = Date.now(); c.workStart = null;
  render(); window.scrollTo(0, 0);
  let text = `Étape ${i + 1}. ${st.instruction}`;
  if (S.settings.lireNotes && st.notes.length) text += `. Note : ${st.notes.join('. ')}`;
  say(text);
  if (c.t && S.settings.autoMinuteur) tStart();
}
function finishStep(){
  const c = S.cook; if (!c) return;
  if (c.i < 0) return goStep(0);
  const st = c.r.etapes[c.i], d = Math.max(1, Math.round((Date.now() - (c.workStart || c.stepStart)) / 1000));
  st.tempsReels = [d, ...st.tempsReels].slice(0, 5);
  c.results[c.i] = d; persist();
  if (c.i >= c.r.etapes.length - 1) return endCook();

}
function prevStep(){
  const c = S.cook; if (!c) return;

  goStep(c.i - 1);
}
function endCook(){
  const c = S.cook; stopAlarm(); cancelNote(true); stopVoice(); keepAwake(false);
  c.t = null; c.matRes = recordMat(); S.screen = 'recap'; render(); window.scrollTo(0, 0);
  say('Recette terminée. Bon appétit !');
}
function recordMat(){
  const c = S.cook, r = c.r;
  if (!c.mats || !c.mats.length || !c.results.some(Boolean)) return [];
  const gmv = load(MKEY, {}), out = [];
  c.mats.forEach(m => {
    const v = (c.mat[m] || '').trim(); if (!v) return;
    gmv[norm(m)] = v;
    let idx = r.etapes.map((_, i) => i).filter(i => stepMat(r, r.etapes[i]).some(x => norm(x) === norm(m)));
    if (!idx.length) idx = r.etapes.map((_, i) => i);
    let gap = 0, cnt = 0;
    idx.forEach(i => { const st = r.etapes[i]; if (c.results[i] && st.temps) { gap += c.results[i] - Math.max(1, Math.round(st.temps * c.f)); cnt++; } });
    if (!cnt) return;
    let e = r.ecarts.find(x => norm(x.item) === norm(m) && norm(x.variant) === norm(v));
    if (!e) { e = { item:m, variant:v, avg:0, n:0 }; r.ecarts.push(e); }
    e.avg = (e.avg * e.n + gap) / (e.n + 1); e.n++;

}

/* Minuteur */
function tStart(){
  const c = S.cook, t = c && c.t;
  if (!c || c.i < 0) return;
  if (!c.workStart) c.workStart = Date.now();
  if (!t) { render(); return say('Chrono lancé.', true); }
  if (t.running) return;
  if (t.remaining <= 0) { t.remaining = t.total; t.done = false; }
  t.endAt = Date.now() + t.remaining * 1000; t.running = true; updTimer(true);
}
function tPause(){ const t = S.cook && S.cook.t; if (!t || !t.running) return; t.remaining = Math.max(0, (t.endAt - Date.now()) / 1000); t.running = false; updTimer(true); }
function tAdd(){
  const c = S.cook; if (!c || c.i < 0) return;
  if (!c.t) { c.t = { base:60, total:60, remaining:60, endAt:0, running:false, done:false }; render(); return tStart(); }
  const t = c.t;
  if (c.alarm || t.done) { stopAlarm(); t.done = false; t.total = 60; t.remaining = 60; t.running = false; return tStart(); }
  if (t.running) t.endAt += 60000; else t.remaining += 60;
  t.total += 60; updTimer(true);
}
function tReset(){ const t = S.cook && S.cook.t; if (!t) return; stopAlarm(); t.running = false; t.done = false; t.total = t.base; t.remaining = t.base; updTimer(true); }
const RING = 2 * Math.PI * 54;
function ctlHtml(t){

    : `<button class="btn mini primary" data-act="t-start">${t.done ? 'Relancer' : t.remaining < t.total ? 'Reprendre' : 'Démarrer'}</button>`;
  return `${main}<button class="btn mini" data-act="t-add">+1 min</button><button class="btn mini" data-act="t-reset">Réinitialiser</button>`;
}
function updTimer(controls){
  const c = S.cook; if (!c || !c.t || S.screen !== 'cook') return;
  const t = c.t, val = $('#tval'), fill = $('#tfill'), box = $('#timer');
  if (!val) return;
  val.textContent = fmtClock(t.remaining);

  if (rem <= 0) { c.t.running = false; c.t.remaining = 0; c.t.done = true; updTimer(true); startAlarm(); }
  else { c.t.remaining = rem; updTimer(false); }

/* ---------- Prix ---------- */
const PKEY = 'pasapas:prix';
const UMULT = { kg:['g', 1000], g:['g', 1], l:['ml', 1000], cl:['ml', 10], ml:['ml', 1], 'pièce':['', 1] };
const UNIT_OPTS = ['kg', 'g', 'l', 'cl', 'ml', 'pièce'];
const fmtEuro = n => n.toLocaleString('fr-FR', { style:'currency', currency:'EUR' });
const keyWords = t => words(String(t).replace(/œ/gi, 'oe').replace(/æ/gi, 'ae')).filter(w => w.length >= 3 && !STOP.has(w)).map(stem);
const wmatch = (a, b) => { if (a === b) return true; const n = Math.min(5, a.length, b.length); return n >= 4 && a.slice(0, n) === b.slice(0, n); };
function nameScore(a, b){ const A = keyWords(a), B = keyWords(b); if (!A.length || !B.length) return 0; const hit = B.filter(w => A.some(v => wmatch(v, w))).length; return hit / B.length; }
function findPrice(name){
  const k = norm(name); let best = null, bs = 0;
  for (const p of S.prices) {
    if (norm(p.name) === k || (p.links || []).includes(k)) return p;
    const sc = nameScore(name, p.name); if (sc > bs) { bs = sc; best = p; }
  }
  return bs >= 0.5 ? best : null;
}
function makePrice(name, prix, qte, unite, extra = {}){
  const [base, mult] = UMULT[unite] || UMULT['pièce'], q = qte > 0 ? qte : 1, ok = prix != null && !isNaN(prix);
  return { name:cap(String(name).trim()), libelle:String(extra.libelle || '').trim(), prix:ok ? prix : null, qte:q, unite, base, perBase:ok ? prix / (q * mult) : null, date:extra.date || new Date().toISOString().slice(0, 10), source:extra.source || 'saisie', links:[...new Set(extra.links || [])] };
}
function upsertPrice(p){
  const i = S.prices.findIndex(x => norm(x.name) === norm(p.name));
  if (i >= 0) { const o = S.prices[i]; p.links = [...new Set([...(o.links || []), ...p.links])]; if (!p.libelle) p.libelle = o.libelle || ''; S.prices[i] = p; } else S.prices.push(p);
}
const savePrices = () => store(PKEY, S.prices);
const fmtQ = n => String(Math.round(n * 1000) / 1000).replace('.', ',');
const priceLabel = p => p.perBase == null ? 'Pas encore de prix' : p.base === 'g' ? `${fmtEuro(p.perBase * 1000)} le kg` : p.base === 'ml' ? `${fmtEuro(p.perBase * 1000)} le litre` : `${fmtEuro(p.perBase)} la pièce`;
const pricePack = p => p && p.prix != null ? `${fmtEuro(p.prix)} pour ${fmtQ(p.qte)} ${p.unite}` : '';
const itemCost = it => { if (it.q == null) return null; const p = findPrice(it.name); return p && p.perBase != null && p.base === it.base ? it.q * p.perBase : null; };
function recipeCost(r, f){ let total = 0, known = 0, unknown = 0; allIngr(r).forEach(x => { const c = itemCost(shopItem(x, f)); if (c == null) unknown++; else { total += c; known++; } }); return { total, known, unknown }; }
function costShort(r){ if (!S.prices.length) return ''; const c = recipeCost(r, 1); return c.known ? `, ≈ ${fmtEuro(c.total)}` : ''; }
function costBox(r, c){
  if (!S.prices.length) return '';
  const k = recipeCost(r, c.f);
  if (!k.known) return `<p class="porhint">Coût : aucun ingrédient de cette recette n’a encore de prix.</p>`;
  return `<div class="totals"><span>Coût estimé</span><b>${fmtEuro(k.total)}</b></div><p class="porhint">Soit ${fmtEuro(k.total / c.portions)} par portion${k.unknown ? `, sans compter ${plural(k.unknown, 'ingrédient')} sans prix` : ''}.</p>`;
}
function ingNames(){ const seen = new Set(), out = []; S.recipes.forEach(r => allIngr(r).forEach(x => { const n = shopItem(x, 1).name; if (n && !seen.has(norm(n))) { seen.add(norm(n)); out.push(n); } })); return out.sort((a, b) => a.localeCompare(b, 'fr')); }
function bestIng(nom, names){ let best = '', bs = 0; names.forEach(n => { const sc = nameScore(nom, n); if (sc > bs) { bs = sc; best = n; } }); return bs >= 0.5 ? best : ''; }
const fmtDateFr = d => { const x = new Date(d + 'T12:00:00'); return isNaN(x) ? d : x.toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' }); };
function priceSheet(p, name){

function buildShop(){
  const map = new Map(), used = [];
  Object.entries(S.shop.sel).forEach(([id, p]) => {
    const r = find(id); if (!r) return;
    used.push(`${r.titre} (${plural(p, 'portion')})`);
    const f = p / (r.portions || 1);

function shrink(file, max = 2000){
  return new Promise(res => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      const g = cv.getContext('2d'); g.filter = 'grayscale(1) contrast(1.25)'; g.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); cv.toBlob(b => res(b || file), 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
function guessTime(t){
  const m = norm(t).match(/(\d+(?:[.,]\d+)?)(?:\s*(?:a|-|ou)\s*(\d+(?:[.,]\d+)?))?\s*(h(?![a-z])|heures?|minutes?|min(?![a-z])|mn(?![a-z]))(?:\s*(\d+))?/);
  if (!m) return null;
  const n = parseFloat((m[2] || m[1]).replace(',', '.'));
  return m[3].startsWith('h') ? Math.round(n * 3600 + (m[4] ? +m[4] * 60 : 0)) : Math.round(n * 60);
}
function textToMarkers(raw){
  const txt = String(raw || '').replace(/\r/g, '');
  if (/^\s*[ée]tape\s*:/im.test(txt)) return txt;
  const lines = txt.split('\n').map(l => l.replace(/[ \t]+/g, ' ').trim()).filter(l => l && /[a-zA-Z0-9À-ÿ]/.test(l));
  const H_ING = /^(les\s+)?ingr[ée]dients?\b/i, H_STEP = /^(la\s+)?(pr[ée]paration|[ée]tapes?|instructions?|r[ée]alisation|progression|m[ée]thode|d[ée]roulement)\b/i, H_MAT = /^(le\s+)?(mat[ée]riel|ustensiles?)\b/i;
  const isHead = (re, l) => l.length < 45 && re.test(l);
  const sawHeader = lines.some(l => isHead(H_ING, l) || isHead(H_STEP, l) || isHead(H_MAT, l));
  const strip = l => l.replace(/^[-–—•*·▪●○◦✓☐]\s*/, '').trim();
  let title = '', portions = null, mode = null;
  const ing = [], mat = [], stepLines = [];
  for (const l of lines) {
    const pm = l.match(/pour\s+(\d+)\s*(personnes?|portions?|parts?|pers\b|couverts?)/i) || l.match(/^(\d+)\s*(personnes?|portions?|parts?)\b/i);

    const after = l.includes(':') ? l.split(':').slice(1).join(':').trim() : '';
    if (isHead(H_ING, l) || (H_ING.test(l) && after)) { mode = 'ing'; if (after && !/^pour\b/i.test(after)) after.split(/\s*[,;]\s*/).filter(Boolean).forEach(x => ing.push(strip(x))); continue; }
    if (isHead(H_MAT, l) || (H_MAT.test(l) && after)) { mode = 'mat'; if (after) after.split(/\s*[,;]\s*/).filter(Boolean).forEach(x => mat.push(cap(x))); continue; }
    if (isHead(H_STEP, l)) { mode = 'step'; continue; }
    if (pm && l.length < 45) continue;
    if (!title && !mode && l.length <= 80) { title = l; continue; }
    if (!mode) { if (sawHeader) continue; mode = 'auto'; }
    if (mode === 'ing') ing.push(strip(l));
    else if (mode === 'mat') strip(l).split(/\s*[,;]\s*/).filter(Boolean).forEach(x => mat.push(cap(x)));
    else if (mode === 'step') stepLines.push(l);
    else { const s2 = strip(l); if (splitQty(s2) && s2.length < 60) ing.push(s2); else stepLines.push(l); }
  }
  const numRe = /^(?:[ée]tape\s*)?(\d{1,2})\s*[.)\-–:]\s*/i;
  const numbered = stepLines.some(l => numRe.test(l));
  const steps = []; let cur = '';
  const push = () => { const t = cur.trim(); if (t) steps.push(t); cur = ''; };
  for (const l of stepLines) {
    if (numbered) { if (numRe.test(l)) { push(); cur = l.replace(numRe, ''); } else cur += (cur ? ' ' : '') + strip(l); }
    else { cur += (cur ? ' ' : '') + strip(l); if (/[.!]$/.test(l)) push(); }
  }
  push();
  const out = [`Recette : ${title || 'Recette sans titre'}`];
  if (portions) out.push(`Portions : ${portions}`);
  if (ing.length) { out.push(''); ing.forEach(x => out.push(`Ingrédient : ${x}`)); }
  if (mat.length) { out.push(''); mat.forEach(x => out.push(`Matériel : ${x}`)); }
  steps.forEach(st => { out.push('', `Étape : ${st}`); const d = guessTime(st); if (d) out.push(`Temps : ${fmtDur(d)}`); });
  return out.join('\n');
}

  if (!d || d.format !== 'pas-a-pas-sauvegarde' || !Array.isArray(d.recettes)) { toast('Ce fichier n’est pas une sauvegarde Boudine’s cook.'); return; }
  const np = (d.prix || []).length;
  const how = await ask('Restaurer la sauvegarde ?', `Sauvegarde du ${fmtDateFr(String(d.date || '').slice(0, 10))} : ${plural(d.recettes.length, 'recette')}, ${np} prix. « Ajouter » garde tes données actuelles et complète avec la sauvegarde ; « Tout remplacer » efface d’abord ce qui est sur le téléphone.`, [{ label:'Ajouter aux données actuelles', value:'merge', kind:'primary' }, { label:'Tout remplacer', value:'replace', kind:'danger' }, { label:'Annuler', value:null }]);
  if (!how) return;
  const recs = [];
  d.recettes.forEach(f => { try { const { recipe } = parse(f.texte); recipe.id = f.id || uid(); recs.push(recipe); } catch (e) {} });
  if (how === 'replace') {
    S.recipes = recs; S.prices = Array.isArray(d.prix) ? d.prix : [];
    store(MKEY, d.materiel || {});
    if (d.reglages) { S.settings = Object.assign(S.settings, d.reglages); store(SKEY, S.settings); }
  } else {
    recs.forEach(r => { if (!S.recipes.some(x => x.id === r.id || norm(x.titre) === norm(r.titre))) S.recipes.push(r); });
    (d.prix || []).forEach(p => { if (p && p.name && !S.prices.some(x => norm(x.name) === norm(p.name))) S.prices.push(p); });
    store(MKEY, Object.assign({}, d.materiel || {}, load(MKEY, {})));
  }
  persist(); savePrices(); render(); toast('Sauvegarde restaurée');
}

S.prices = load(PKEY, []);
loadRecipes();
render();
initPhoto();
</script>
