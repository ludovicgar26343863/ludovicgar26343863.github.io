<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boudine’s cook</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B6E7A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DDEEF2; --surface:#FFFFFF; --ink:#0D2A31; --muted:#4A6970; --line:#C5DCE2;
  --herb:#0B6E7A; --herb-ink:#FFFFFF; --saffron:#2A93C9; --saffron-soft:#D5EBF5;
  --alert:#B5380F; --alert-ink:#FFFFFF; --scrim:rgba(5,25,32,.45);
  --g1:#0B8291; --g2:#0B5C92; --grad:linear-gradient(135deg,#0B8291 0%,#0B5C92 100%);
  --bg-grad:linear-gradient(180deg,#EEF7F9 0%,#D6E9EF 100%); --bar:rgba(232,244,247,.9);
  --f-body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-head:'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif;
  --f-mono:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1B22; --surface:#10262E; --ink:#E4F1F4; --muted:#8FB0B8; --line:#1E3C46;
    --herb:#4CC0CC; --herb-ink:#04171B; --saffron:#5BB8E6; --saffron-soft:#123447;
    --alert:#F07444; --alert-ink:#1C0D06; --scrim:rgba(0,0,0,.6);
    --g1:#0E8C9A; --g2:#1060A0; --grad:linear-gradient(135deg,#0E8C9A 0%,#1060A0 100%);
    --bg-grad:linear-gradient(180deg,#0A1B22 0%,#0B2030 100%); --bar:rgba(10,27,36,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1B22; --surface:#10262E; --ink:#E4F1F4; --muted:#8FB0B8; --line:#1E3C46;
  --herb:#4CC0CC; --herb-ink:#04171B; --saffron:#5BB8E6; --saffron-soft:#123447;
  --alert:#F07444; --alert-ink:#1C0D06; --scrim:rgba(0,0,0,.6);
    --g1:#0E8C9A; --g2:#1060A0; --grad:linear-gradient(135deg,#0E8C9A 0%,#1060A0 100%);
    --bg-grad:linear-gradient(180deg,#0A1B22 0%,#0B2030 100%); --bar:rgba(10,27,36,.9);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:20px 18px 130px}
body[data-screen="cook"] #app{padding-bottom:170px}
h1,h2,h3{font-family:var(--f-head);line-height:1.08;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:17px;text-align:center}
.btn.primary{background:var(--herb);color:var(--herb-ink);border-color:var(--herb)}
.btn.danger{color:var(--alert)}
.btn.ghost{background:transparent;border-color:transparent;padding:8px 10px;min-height:44px}
.btn.mini{min-height:42px;padding:6px 14px;font-size:15px;border-radius:11px}
.btn[disabled]{opacity:.4;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.iconbtn[disabled]{opacity:.35;cursor:default}
.hint{color:var(--muted);font-size:16px;margin:14px 0}
.stack{display:flex;flex-direction:column;gap:10px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sec{font-size:21px;margin:36px 0 12px}
.sub{font-size:21px;margin:26px 0 10px}

/* Accueil */
.hero{margin:18px 0 28px}
.hero h1{font-size:clamp(52px,16vw,84px);font-weight:800;letter-spacing:-.025em;line-height:.92}
.hero h1 span{display:block}
.hero h1 span:nth-child(2){padding-left:.85em}
.hero h1 span:nth-child(3){padding-left:1.7em}
.hero p{color:var(--muted);margin-top:18px;font-size:19px}
.choice{display:block;width:100%;text-align:left;padding:22px 20px;border-radius:22px;margin-bottom:14px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface)}
.choice.launch{background:var(--herb);color:var(--herb-ink);border-color:var(--herb)}
.choice strong{display:block;font-family:var(--f-head);font-size:29px;font-weight:800;line-height:1.1}
.choice span{display:block;margin-top:4px;font-size:16px;opacity:.85}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1.5px solid var(--line);cursor:pointer}
.toggle input{width:26px;height:26px;accent-color:var(--herb);flex:none}

/* Barres de titre */
.topbar{display:flex;align-items:center;gap:6px;margin:-4px -8px 16px}
.topbar h2{font-size:25px;flex:1}

/* Liste */
.search{width:100%;margin-bottom:14px}
.rrow{display:flex;align-items:center;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;padding-right:8px}
.rrow .main{flex:1;text-align:left;background:none;border:none;padding:16px;cursor:pointer;min-height:68px}
.rrow .main b{display:block;font-size:21px;line-height:1.2}
.rrow .main small{display:block;color:var(--muted);font-size:15px;margin-top:3px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}

/* Champs */
input,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{resize:vertical;min-height:64px;line-height:1.4}
input.short{max-width:120px}
.lbl{display:block;font-weight:700;font-size:15px;color:var(--muted);margin:16px 0 0}
.lbl input,.lbl textarea{margin-top:6px;font-weight:400;color:var(--ink)}
.tabs{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{flex:1;border:none;background:none;border-radius:10px;min-height:44px;font-weight:700;cursor:pointer;font-size:16px}
.tabs button[aria-pressed="true"]{background:var(--herb);color:var(--herb-ink)}
.error{background:var(--saffron-soft);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:16px}
.ingrow,.noterow{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.stepcard{border:1.5px solid var(--line);border-radius:18px;padding:14px;margin:14px 0;background:var(--surface)}
.stepcard input,.stepcard textarea{background:var(--bg)}
.sc-head{display:flex;align-items:center;gap:6px}
.sc-head .num{font-family:var(--f-head);font-weight:800;font-size:22px;flex:1}
.timeinputs{display:flex;gap:8px;align-items:center;margin-top:6px;color:var(--ink);font-weight:400}
.timeinputs input{width:84px;margin:0}
.reels{font-size:14px;color:var(--muted);margin-top:10px}
.raw{font-family:var(--f-mono);font-size:15px;line-height:1.55;min-height:58vh;margin-top:14px}
.savebar,.cookbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1.5px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
.savebar .btn{flex:1;max-width:320px}

/* Cuisson */
.cook-top{display:flex;align-items:center;gap:8px;margin:-4px -8px 0}
.mic{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:6px 14px;min-height:42px;font-weight:700;font-size:15px;cursor:pointer}
.mic .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.mic.on{border-color:var(--herb)}
.mic.on .dot{background:var(--herb);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.heard{font-size:15px;color:var(--muted);min-height:22px;margin-top:6px}
.progress{height:6px;background:var(--line);border-radius:6px;margin:12px 0 20px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--herb);border-radius:6px}
.stepno{font-family:var(--f-head);font-weight:800;font-size:18px;color:var(--muted)}
.instr{font-size:clamp(27px,7.4vw,38px);line-height:1.22;font-weight:700;margin:8px 0 18px;white-space:pre-line;font-family:var(--f-body)}
h2.instr{font-family:var(--f-head);font-weight:800}
.desc{font-size:19px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;font-size:17px}
.notebox{border-left:5px solid var(--saffron);background:var(--surface);padding:10px 14px;border-radius:0 12px 12px 0;margin:8px 0;font-size:19px}
.inglist{padding-left:24px;font-size:21px;margin:0}
.inglist li{margin:6px 0}
.timer{display:flex;align-items:center;gap:18px;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:16px;margin:16px 0}
.dial{position:relative;width:136px;height:136px;flex:none}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .track{stroke:var(--line)}
.dial .fill{stroke:var(--saffron);transition:stroke-dashoffset .25s linear}
.dial .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-weight:800;font-size:31px;font-variant-numeric:tabular-nums}
.timer.done .dial .fill{stroke:var(--alert)}
.timer .tlabel{font-size:15px;color:var(--muted);margin-bottom:10px}
.timer .ctl{display:flex;flex-wrap:wrap;gap:8px}
.past{font-size:16px;color:var(--muted);margin-top:4px}
.next{color:var(--muted);font-size:17px;margin-top:22px}
.cookbar .done-btn{flex:1;max-width:440px;min-height:66px;font-size:23px;font-family:var(--f-head);font-weight:800;border-radius:18px}
.cookbar .back-btn{min-width:66px;min-height:66px;font-size:24px;border-radius:18px}
.alarm{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;max-width:616px;margin:0 auto;background:var(--alert);color:var(--alert-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.alarm b{font-family:var(--f-head);font-size:26px;line-height:1.1}
.alarm .row2{display:flex;gap:8px}
.alarm .btn{flex:1;background:var(--alert-ink);color:var(--alert);border:none}
.notepanel{position:fixed;left:12px;right:12px;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:15;max-width:616px;margin:0 auto;background:var(--surface);border:2px solid var(--saffron);border-radius:20px;padding:16px;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.notepanel b{font-family:var(--f-head);font-size:21px}
.notepanel p{margin:8px 0;font-size:18px}
.notepanel .muted{color:var(--muted);font-size:15px}
.notepanel textarea{margin:8px 0}

/* Portions et courses */
.stepper{display:flex;align-items:center;gap:16px;margin:10px 0 6px}
.stepper output{font-family:var(--f-head);font-weight:800;font-size:46px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.stepper .unit{color:var(--muted);font-size:16px}
.iconbtn.big{width:58px;height:58px;font-size:28px;border-radius:16px}
.porhint{color:var(--muted);font-size:16px}
.totals{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin:16px 0 4px}
.totals b{font-family:var(--f-head);font-size:26px;font-weight:800}
.shoprow{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;padding:12px 14px}
.shoprow.on{border-color:var(--herb)}
.pick{display:flex;gap:12px;align-items:center;cursor:pointer}
.pick input,.shoplist input{width:24px;height:24px;accent-color:var(--herb);flex:none;margin:0;padding:0}
.pick b{display:block;font-size:19px;line-height:1.25}
.pick small{display:block;color:var(--muted);font-size:15px}
.shoprow .stepper{margin:10px 0 2px 36px;gap:12px}
.shoprow .stepper output{font-size:28px}
.shoplist{list-style:none;padding:0;margin:0}
.shoplist label{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1.5px solid var(--line);font-size:18px;cursor:pointer}
.shoplist .off span{text-decoration:line-through;color:var(--muted)}

/* Dictée, matériel */
.withmic{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
.withmic input,.withmic textarea{margin:0}
.iconbtn.rec{background:var(--alert);color:var(--alert-ink);border-color:var(--alert)}
.btn svg,.iconbtn svg{flex:none}
.chips .chiplab{font-size:14px;font-weight:700;color:var(--muted);align-self:center;margin-right:2px}
.chip.tool{border-style:dashed}
.matrow{margin:14px 0}
.matname{display:block;font-weight:700;font-size:18px;margin-bottom:6px}
.gaps{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:16px}
.gaps li{margin:3px 0}

/* Récap */
.recap-h{font-size:clamp(44px,13vw,68px);font-weight:800;letter-spacing:-.02em;margin:22px 0 10px}
.scroll{overflow-x:auto;margin:20px 0}
table.recap{width:100%;border-collapse:collapse}
.recap th,.recap td{padding:11px 6px;border-bottom:1.5px solid var(--line);text-align:left;font-size:16px;vertical-align:top}
.recap th{color:var(--muted);font-weight:700}
.recap .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.recap tfoot td{font-weight:700;border-bottom:none}

/* Feuilles et messages */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet h3{font-size:23px;margin-bottom:8px}
.sheet p{color:var(--muted);margin:6px 0}
.sheet ul{padding-left:20px}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sheet .raw{min-height:40vh;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:40;font-size:16px;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
@media (prefers-reduced-motion: reduce){.mic.on .dot{animation:none}.dial .fill{transition:none}}
/* Gestion des recettes */
.mrow{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.mrow b{display:block;font-size:19px;line-height:1.25}
.mrow small{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.mbtns{display:flex;gap:8px;margin-top:12px}
.mbtns .btn{flex:1}

/* Prix et tickets */
.tgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.tgrid .lbl{margin:0}
select{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;margin-top:6px}
.trow{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.trow.off{opacity:.45}
.thead{display:flex;gap:10px;align-items:center}
.thead input[type="checkbox"]{width:24px;height:24px;flex:none;accent-color:var(--herb);margin:0;padding:0}
.thead input[type="text"]{font-weight:700}
.mrow.warn{border-style:dashed}

/* Ticket : deux colonnes */
.tk-head{display:grid;grid-template-columns:28px 1fr 16px 1fr;gap:8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:4px 14px 6px}
.tk{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.tk.none{border-style:dashed}
.tk.off .tk-top{opacity:.45}
.tk-top{display:grid;grid-template-columns:28px 1fr 16px 1fr;gap:8px;align-items:start}
.tk-top input[type="checkbox"]{width:24px;height:24px;accent-color:var(--herb);margin:2px 0 0;padding:0}
.tk-col{min-width:0}
.tk-col b{display:block;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.tk-col span{display:block;font-size:15px;color:var(--muted);margin-top:2px}
.tk-col .muted{color:var(--muted)}
.tk-arrow{color:var(--muted);padding-top:2px}
.tk-bot{display:flex;gap:8px;align-items:center;margin-top:10px}
.tk-bot select{margin:0;flex:1;min-width:0;font-size:15px}
.tk-note{font-size:14px;color:var(--herb);margin-top:6px;font-weight:700}
.mrow small + small{margin-top:0}
.matv input{font-size:15px;padding:7px 10px;margin-top:6px}
.matv .gaps{font-size:14px;margin-top:4px}

.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
label.btn{cursor:pointer;position:relative}

/* Zones sur la photo */
.ztypes{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.ztypes button{border:2px solid var(--zc);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;min-height:42px;cursor:pointer}
.ztypes button[aria-checked="true"]{background:var(--zc);color:#fff}
.zpager{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;font-weight:700}
.zwrap{position:relative;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:12px;overflow:hidden;background:#000}
.zwrap img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.zlayer{position:absolute;inset:0}
.zbox{position:absolute;border:3px solid var(--zc);background:color-mix(in srgb, var(--zc) 18%, transparent);border-radius:4px}
.zbox.drawing{border-style:dashed}
.ztag{position:absolute;left:0;top:0;background:var(--zc);color:#fff;font-size:12px;font-weight:700;padding:1px 6px;border-radius:0 0 4px 0;white-space:nowrap;pointer-events:none}
.zdel{position:absolute;right:-1px;top:-1px;width:34px;height:34px;border:none;border-radius:0 0 0 6px;background:var(--zc);color:#fff;font-weight:700;cursor:pointer;font-size:15px}

.ver{text-align:center;color:var(--muted);font-size:13px;margin:32px 0 0;opacity:.8}

.matlist li{margin:8px 0}
.matline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn.matbtn{width:38px;height:38px;font-size:20px;border-radius:50%;flex:none}
.matprec{font-size:15px;color:var(--muted);margin-top:2px}
.chrono{display:inline-flex;align-items:center;gap:8px;font-size:16px;color:var(--muted)}
.chrono b{font-family:var(--f-head);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}

.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.thumb{position:relative}
.thumbimg{display:block;width:96px;height:96px;padding:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);cursor:zoom-in}
.thumbimg img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .zdel{--zc:var(--alert);border-radius:0 10px 0 8px}
.thumbcap{font-size:13px;color:var(--muted);margin-top:4px;text-align:center}
#viewer{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
#viewer.zoom{align-items:flex-start;justify-content:flex-start}
#viewer.zoom img{max-width:none;max-height:none;width:250%;cursor:zoom-out}

<body>

<div id="alarm-host"></div>
<div id="note-host"></div>
<script>
'use strict';
const APP_VERSION = '1.43';
const $ = s => document.querySelector(s);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[’]/g, "'").toLowerCase().trim();
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const plural = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;

/* ---------- Stockage local (un texte à marqueurs par recette) ---------- */
const KEY = 'pasapas:recettes', SKEY = 'pasapas:reglages';
/* ---------- Base de données du téléphone (IndexedDB), avec repli sur l'ancien stockage ---------- */
const KV = { ready:false, cache:{}, migrated:false };
const jclone = v => v === undefined ? v : JSON.parse(JSON.stringify(v));
function load(k, d){
  if (KV.ready) return k in KV.cache ? jclone(KV.cache[k]) : d;
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; }
}
function store(k, v){
  if (KV.ready) { KV.cache[k] = jclone(v); IDBX.kv.put(k, KV.cache[k]).catch(() => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }); return; }
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}

/* ---------- Durées ---------- */
function parseDuration(v){
  const s = norm(v).replace(/,/g, '.');
  if (!s) return null;
  const re = /(\d+(?:\.\d+)?)\s*(heures?|h|minutes?|min|mn|m|secondes?|sec|s)?/g;
  let total = 0, prev = null, found = false, m;
  while ((m = re.exec(s))) {
    found = true;
    const n = parseFloat(m[1]);
    let u = m[2] || (prev === 'h' ? 'min' : prev === 'min' ? 's' : 'min');
    if (u.startsWith('h')) { total += n * 3600; prev = 'h'; }
    else if (u.startsWith('s')) { total += n; prev = 's'; }
    else { total += n * 60; prev = 'min'; }

  return found ? Math.round(total) : null;
}
function fmtDur(sec){
  if (sec == null) return '';
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60, p = [];
  if (h) p.push(`${h} h`);
  if (m) p.push(`${m} min`);
  if (s || !p.length) p.push(`${s} s`);
  return p.join(' ');
}
function fmtClock(sec){
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60, two = x => String(x).padStart(2, '0');
  return h ? `${h}:${two(m)}:${two(s)}` : `${two(m)}:${two(s)}`;
}
function fmtSpeech(sec){
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec / 60), s = sec % 60, p = [];
  if (m) p.push(plural(m, 'minute'));
  if (s || !p.length) p.push(plural(s, 'seconde'));

}

/* ---------- Quantités ---------- */
const UNITS = { g:['g',1], gr:['g',1], grammes:['g',1], kg:['g',1000], mg:['g',.001], l:['ml',1000], litre:['ml',1000], litres:['ml',1000], dl:['ml',100], cl:['ml',10], ml:['ml',1] };
const FRAC = { '½':.5, '¼':.25, '¾':.75, '⅓':1/3, '⅔':2/3 };
function splitQty(txt){
  const m = String(txt).trim().match(/^(\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?|[½¼¾⅓⅔])\s*(.*)$/);
  if (!m) return null;
  const a = m[1]; let q;
  if (FRAC[a]) q = FRAC[a];
  else if (a.includes('/')) { const [x, y] = a.split('/').map(v => parseFloat(v.replace(',', '.'))); q = y ? x / y : x; }
  else q = parseFloat(a.replace(',', '.'));
  let rest = m[2], unit = '';
  const um = rest.match(/^([a-zA-Zéè]+)\.?(?=\s|$)\s*(.*)$/);
  if (um && UNITS[um[1].toLowerCase()]) { unit = um[1]; rest = um[2]; }
  return { q, unit, rest };
}
function fmtQty(n){ const r = n >= 10 ? Math.round(n) : Math.round(n * 10) / 10; return String(r).replace('.', ','); }
function scaleIngr(txt, f){
  if (f === 1) return txt;
  const p = splitQty(txt); if (!p) return txt;
  return `${fmtQty(p.q * f)}${p.unit ? ' ' + p.unit : ''} ${p.rest}`.trim();
}
function shopItem(txt, f){
  const p = splitQty(txt);
  if (!p) return { key:'x|' + norm(txt), name:cap(String(txt).trim()), q:null, base:'' };
  const name = p.rest.replace(/^(de |des |d'|d’)/i, '').trim();
  let base = '', q = p.q * f;
  if (p.unit) { const [b, mul] = UNITS[p.unit.toLowerCase()]; base = b; q *= mul; }
  return { key:base + '|' + norm(name), name:cap(name), q, base };
}
function fmtShopQty(q, base){
  if (base === 'g') return q >= 1000 ? `${fmtQty(q / 1000)} kg` : `${fmtQty(q)} g`;
  if (base === 'ml') return q >= 1000 ? `${fmtQty(q / 1000)} l` : q >= 100 ? `${fmtQty(q / 10)} cl` : `${fmtQty(q)} ml`;
  return fmtQty(q);
}

/* ---------- Format texte à marqueurs ---------- */
const MARKERS = { 'recette':1, 'description':1, 'portions':1, 'ingredient':1, 'ingredients':1, 'etape':1, 'temps':1, 'temps reel':1, 'temps reels':1, 'note':1, 'photo':1, 'prix de vente':1, 'materiel':1, 'ecart materiel':1, 'ecart':1 };
function parse(text, opts = {}){
  const lines = String(text).replace(/\r/g, '').split('\n');
  const r = { titre:'', description:'', portions:null, prixVente:null, ingredients:[], materiel:[], etapes:[], ecarts:[], photos:[] };
  let cur = null, last = null;
  const append = (val) => {
    if (!last) return false;
    if (last.arr) last.arr[last.i] = (last.arr[last.i] ? last.arr[last.i] + '\n' : '') + val;
    else last.o[last.f] = (last.o[last.f] ? last.o[last.f] + '\n' : '') + val;
    return true;
  };
  lines.forEach((line, idx) => {
    const ln = idx + 1;
    if (!line.trim()) return;
    const m = line.match(/^\s*([^:]{2,24}?)\s*:\s?(.*)$/);
    const k = m ? norm(m[1]) : '';
    if (!m || !MARKERS[k]) { append(line.trim()); return; }
    const v = m[2].trim();
    if (k === 'recette') { r.titre = v; last = { o:r, f:'titre' }; }
    else if (k === 'description') { r.description = v; last = { o:r, f:'description' }; }
    else if (k === 'portions') { r.portions = parseInt(v, 10) || null; last = null; }
    else if (k === 'prix de vente') { const pv = parseFloat(v.replace(',', '.').replace(/[^\d.]/g, '')); r.prixVente = pv > 0 ? pv : null; last = null; }
    else if (k === 'ingredient' || k === 'ingredients') {
      const arr = cur ? cur.ingredients : r.ingredients;
      arr.push(v); last = { arr, i: arr.length - 1 };
    }
    else if (k === 'etape') {
      cur = { instruction:v, temps:null, tempsReels:[], ingredients:[], materiel:[], notes:[] };
      r.etapes.push(cur); last = { o:cur, f:'instruction' };
    }
    else if (k === 'temps') {
      if (!cur) { last = null; return; }
      if (v) { const d = parseDuration(v); if (d == null) throw new Error(`Ligne ${ln} : durée illisible (« ${v} »). Exemple attendu : 5 min, 1 h 30 ou 45 s.`); cur.temps = d || null; }
      last = null;
    }
    else if (k.startsWith('temps reel')) {
      if (cur) cur.tempsReels = v.split(/[,;]/).map(parseDuration).filter(x => x != null).slice(0, 5);
      last = null;
    }
    else if (k === 'photo') { if (v) r.photos.push(v); last = null; }
    else if (k === 'materiel') {
      const arr = cur ? cur.materiel : r.materiel;
      arr.push(v); last = { arr, i: arr.length - 1 };
    }
    else if (k.startsWith('ecart')) {
      const em = v.match(/^(.+?),\s*(.+?)\s*:\s*([+\-−]?)\s*(.+?)\s+sur\s+(\d+)\s+fois\s*$/i);
      if (em) { const d = parseDuration(em[4]) || 0; r.ecarts.push({ item:em[1].trim(), variant:em[2].trim(), avg:/[-−]/.test(em[3]) ? -d : d, n:+em[5] }); }
      last = null;
    }
    else if (k === 'note') {
      if (!cur) { last = null; return; }
      cur.notes.push(v); last = { arr:cur.notes, i:cur.notes.length - 1 };
    }
  });
  if (!opts.lenient) {
    if (!r.titre) throw new Error('Il manque la ligne « Recette : » avec le nom de la recette.');
  }
  return { recipe:r };
}
function serialize(r){
  const out = [], multi = (marker, text) => { const ls = String(text).split('\n'); out.push(`${marker} : ${ls[0]}`); ls.slice(1).forEach(l => out.push(l)); };
  multi('Recette', r.titre || '');
  if (r.description) multi('Description', r.description);
  if (r.portions) out.push(`Portions : ${r.portions}`);
  if (r.prixVente > 0) out.push(`Prix de vente : ${(+r.prixVente).toFixed(2).replace('.', ',')} €`);
  (r.photos || []).forEach(p => out.push(`Photo : ${p}`));
  const gi = (r.ingredients || []).filter(x => x && x.trim());
  if (gi.length) { out.push(''); gi.forEach(x => out.push(`Ingrédient : ${x}`)); }
  const gmat = (r.materiel || []).filter(x => x && x.trim());
  if (gmat.length) { out.push(''); gmat.forEach(x => out.push(`Matériel : ${x}`)); }
  (r.etapes || []).forEach(e => {
    out.push('');
    multi('Étape', e.instruction || '');
    (e.ingredients || []).filter(x => x && x.trim()).forEach(x => out.push(`Ingrédient : ${x}`));
    (e.materiel || []).filter(x => x && x.trim()).forEach(x => out.push(`Matériel : ${x}`));
    if (e.temps) out.push(`Temps : ${fmtDur(e.temps)}`);
    if (e.tempsReels && e.tempsReels.length) out.push(`Temps réel : ${e.tempsReels.map(fmtDur).join(', ')}`);
    (e.notes || []).filter(x => x && x.trim()).forEach(x => multi('Note', x));
  });
  if (r.ecarts && r.ecarts.length) { out.push(''); r.ecarts.forEach(e => out.push(`Écart matériel : ${e.item}, ${e.variant} : ${e.avg < 0 ? '-' : '+'}${fmtDur(Math.abs(Math.round(e.avg)))} sur ${e.n} fois`)); }
  return out.join('\n') + '\n';
}
const STOP = new Set(['de','des','du','la','le','les','un','une','au','aux','et','en','pour','avec','sans','gros','petit','petite','petits','grand','grande','frais','fraiche','temperature','ambiante','paris','tranche','tranches','pincee','morceau','morceaux']);
const stem = w => w.replace(/(s|x)$/, '');
const words = t => norm(t).replace(/[^a-z0-9œæ' ]/g, ' ').split(/[\s']+/).filter(Boolean);
function stepIngr(r, st){
  if (st.ingredients.length) return st.ingredients;
  const inStep = keyWords(st.instruction);
  return r.ingredients.filter(x => { const nm = shopItem(x, 1).name; return specKw(nm).some(k => inStep.some(w => wmatch(w, k))) && !adjConflict(nm, st.instruction); });
}
const allIngr = r => { const seen = new Set(), out = []; [...r.ingredients, ...r.etapes.flatMap(e => e.ingredients)].forEach(x => { const t = (x || '').trim(); if (t && !seen.has(norm(t))) { seen.add(norm(t)); out.push(t); } }); return out; };
function stepMat(r, st){
  if (st.materiel && st.materiel.length) return st.materiel;
  const inStep = new Set(words(st.instruction).map(stem));
  return (r.materiel || []).filter(x => words(x).filter(w => w.length >= 3 && !STOP.has(w)).some(w => inStep.has(stem(w))));
}
const allMat = r => { const seen = new Set(), out = []; [...(r.materiel || []), ...r.etapes.flatMap(e => e.materiel || [])].forEach(x => { const t = (x || '').trim(); if (t && !seen.has(norm(t))) { seen.add(norm(t)); out.push(t); } }); return out; };
function gapText(s){ const a = Math.abs(Math.round(s)); if (a < 5) return 'même temps que prévu'; return s < 0 ? `gain de ${fmtDur(a)}` : `perte de ${fmtDur(a)}`; }
const MKEY = 'pasapas:materiel';
const estTotal = r => r.etapes.reduce((a, e) => a + (e.temps || 0), 0);
const firstWords = (t, n) => { const w = String(t).replace(/\s+/g, ' ').trim().split(' '); return w.length > n ? w.slice(0, n).join(' ') + '…' : w.join(' '); };
const fileName = r => (String(r.titre).replace(/[\\/:*?"<>|]/g, '-').trim() || 'recette') + '.recette.txt';

const TEMPLATE = `Recette : Nom de la recette
Description : Une phrase pour la présenter.
Portions : 4

Ingrédient : 200 g de …
Ingrédient : …

Matériel : Casserole

Étape : Ce qu’il faut faire.
Temps : 5 min
Note : Une astuce pour la prochaine fois.

Étape : L’étape suivante.
Temps : 10 min
`;
const SEED = [
`Recette : Essai rapide du minuteur
Description : Deux étapes courtes pour tester l’alerte et les commandes vocales.
Portions : 1

Ingrédient : Un verre d’eau

Étape : Pose le téléphone à un mètre et dis « lance le minuteur ».
Temps : 10 s

Étape : Dis « ajoute une minute », puis « combien de temps », puis « étape terminée ».
Temps : 20 s
Note : Tu peux aussi dire « note » pour dicter une annotation.
`,
`Recette : Risotto aux champignons
Description : Version simple du dimanche.
Portions : 4

Ingrédient : 320 g de riz arborio
Ingrédient : 300 g de champignons de Paris
Ingrédient : 1 l de bouillon de légumes

Matériel : Sauteuse
Matériel : Louche

Étape : Faire dorer les champignons émincés à feu vif.
Temps : 5 min
Temps réel : 6 min 10 s, 5 min 40 s, 5 min 55 s
Note : Ne pas saler trop tôt, attendre la fin de cuisson.

Étape : Ajouter le riz et le nacrer en remuant.
Temps : 2 min
Temps réel : 2 min 30 s, 2 min 15 s

Étape : Verser le bouillon louche par louche en remuant,
jusqu’à ce que le riz soit crémeux.
Temps : 18 min
`,
`Recette : Œufs mollets
Description : Blanc pris, jaune coulant.
Portions : 2

Ingrédient : 4 œufs à température ambiante
Ingrédient : Gros sel

Matériel : Casserole
Matériel : Écumoire

Étape : Porter une casserole d’eau à ébullition avec une pincée de gros sel.
Temps : 8 min

Étape : Plonger délicatement les œufs dans l’eau bouillante.
Temps : 6 min

Étape : Les transférer dans un bol d’eau glacée.
Temps : 2 min

Étape : Les écaler doucement sous un filet d’eau froide.
`];

/* ---------- État ---------- */
const S = {
  recipes: [],
  settings: Object.assign({ lire:true, autoMinuteur:true, lireNotes:false, smic:12.31, forfaitH:3 }, load(SKEY, {})),
  screen:'home', q:'', draft:null, tab:'form', editErr:'', from:'home', cook:null, shop:{ sel:{}, skip:{} }, shopText:'', prices:[], ticket:null
};
function persist(){
  const prev = new Map((load(KEY, []) || []).map(e => [e.id, e])), now = Date.now(), seen = new Set();
  const out = S.recipes.map(r => { const texte = serialize(r), p = prev.get(r.id); seen.add(r.id); r.maj = p && p.texte === texte ? (p.maj || r.maj || now) : (r._imp ? (r.maj || now) : now); delete r._imp; return { id:r.id, texte, maj:r.maj }; });
  const tomb = load(TKEY, {}); let ch = false; prev.forEach((p, id) => { if (!seen.has(id)) { tomb['recette:' + id] = now; ch = true; } }); if (ch) store(TKEY, tomb);
  store(KEY, out);
}
function loadRecipes(){
  const raw = load(KEY, null);
  const list = Array.isArray(raw) ? raw : SEED.map(t => ({ id:uid(), texte:t }));
  S.recipes = [];
  list.forEach(f => { try { const { recipe } = parse(f.texte); recipe.id = f.id || uid(); recipe.maj = f.maj || 0; S.recipes.push(recipe); } catch (e) {} });
  if (!Array.isArray(raw)) persist();
}
const find = id => S.recipes.find(r => r.id === id);
function uniqueTitle(t){ let n = 2, x = t; while (S.recipes.some(r => norm(r.titre) === norm(x))) x = `${t} (${n++})`; return x; }

/* ---------- Son, voix, écran ---------- */
let AC = null;
function ensureAudio(){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
function beep(f = 880, d = .16, v = .28){
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = 'sine'; o.frequency.value = f;

/* ---------- Liens ingrédients ↔ étapes : quantités dans le texte des étapes ---------- */
const GENERIC = new Set(['blanc', 'jaune', 'feuille', 'morceau', 'tranche', 'filet', 'grain', 'zeste', 'fine', 'entier', 'gro', 'frai', 'chaud', 'froid']);
const specKw = name => { const k = keyWords(name); const s = k.filter(w => !GENERIC.has(w)); return s.length ? s : k; };
const TIMEW = /^(heures?|h|minutes?|min|mn|secondes?|sec|s|fois|jours?|nuits?|cm|mm|degr[ée]s?|personnes?|portions?|parts?|ans?)$/i;
const ADJG = [['chaud', 'froid', 'tiede', 'bouillant', 'glace'], ['blanc', 'noir', 'rouge', 'vert', 'jaune', 'brun', 'violet'], ['frai', 'sec', 'seche', 'surgele']];
function adjConflict(name, text){
  const tag = ws => ws.map(w => { for (const g of ADJG) { const k = g.find(a => w.startsWith(a)); if (k) return [g, k]; } return null; }).filter(Boolean);
  const a = tag(keyWords(name)), b = tag(keyWords(text));
  return a.some(([g, k]) => b.some(([g2, k2]) => g2 === g && k2 !== k) && !b.some(([g2, k2]) => g2 === g && k2 === k));
}
const STEP_UNITS = 'kg|g|mg|l|cl|ml|dl|cs|cc|c\\.?\\s*(?:à|a)\\s*[sc]\\.?|cuill?[eè]res?(?:\\s+(?:à|a)\\s+(?:soupe|caf[eé]))?|pinc[ée]es?|sachets?|gousses?|tranches?|verres?|tasses?|bottes?|bo[iî]tes?|feuilles?|brins?|pots?|branches?';
const STOPCUT = /^(et|avec|dans|pour|puis|ou|en|au|aux|sur|à|a|le|la|les|du|un|une|que|qui|jusqu)$/i;
function recipeQtyMap(r){
  const out = [];
  const add = (line, name, src) => { const kw = specKw(name); if (!kw.length || out.some(e => e.kw.some(k => kw.includes(k)))) return; out.push({ line, name, kw, src }); };
  (r.ingredients || []).forEach(x => { if (splitQty(x)) add(x, shopItem(x, 1).name, -1); });
  (r.etapes || []).forEach((st, si) => {
    const txt = String(st.instruction || ''), re = new RegExp(`(\\d+(?:[.,]\\d+)?|[½¼¾⅓⅔])\\s*(${STEP_UNITS})?(?![a-zà-ÿ0-9])\\s*(?:de\\s+|d['’]\\s*)?([a-zà-ÿœ'’]+(?:\\s+(?:de\\s+|d['’]\\s*)?[a-zà-ÿœ]+){0,3})`, 'gi');
    let m;
    while ((m = re.exec(txt))) {
      const cut = []; for (const w of m[3].split(/\s+/)) { if (STOPCUT.test(w)) break; cut.push(w); }
      const name = cut.join(' ').replace(/^(de\s+|d['’]\s*)/i, '').trim();
      if (!name || TIMEW.test(cut[0] || '')) continue;
      add(`${m[1]}${m[2] ? ' ' + m[2] : ''} de ${name}`, name, si);
    }
  });
  return out;
}
function fmtUQ(n, unit){
  const u = String(unit).toLowerCase();
  if (u === 'kg' && n < 1) return `${Math.round(n * 1000)} g`;
  if (u === 'l' && n < 1) return `${Math.round(n * 100)} cl`;
  if (u === 'g' && n >= 1000) return `${fmtQty(n / 1000)} kg`;

}
function stepRender(st, r, f, si, asHtml){
  const txt = String(st.instruction || ''); if (!txt) return '';
  const entries = recipeQtyMap(r), allKw = entries.flatMap(e => e.kw), ops = [];
  const numRe = new RegExp(`(\\d+(?:[.,]\\d+)?|[½¼¾⅓⅔])(\\s*)(${STEP_UNITS})?(?![a-zà-ÿ0-9])`, 'gi');
  let m;
  while ((m = numRe.exec(txt))) {
    const at = m.index, end = at + m[0].length, before = txt.slice(Math.max(0, at - 16), at), after = txt.slice(end), unit = m[3];
    if (/[\d\/]$/.test(before)) continue;
    if (!unit) { const w = (after.match(/^\s*(?:de\s+|d['’]\s*)?([a-zà-ÿœ]+)/i) || [])[1]; if (!w || TIMEW.test(w) || !keyWords(w).some(k => allKw.some(a => wmatch(a, k)))) continue; }
    if (/(?:chaque|par|prendre|prends|déposer|dépose|y)\s*$/i.test(before)) continue;

    for (let k = 0; k < ws.length; k++) {
      if (!keyWords(ws[k].w).some(x => e.kw.some(y => wmatch(x, y)))) continue;
      if (/\d/.test(txt.slice(Math.max(0, ws[k].at - 25), ws[k].at))) return;
      if (k > 0 && keyWords(ws[k - 1].w).some(x => GENERIC.has(x))) continue;
      if (ops.some(o => ws[k].at < o.end && ws[k].end > o.at)) return;
      const nameKw = keyWords(e.name); let last = k;
      for (let q = k + 1; q < ws.length && q <= k + 3; q++) { if (/^(de|d['’]?)$/i.test(ws[q].w)) continue; if (keyWords(ws[q].w).some(x => nameKw.some(y => wmatch(x, y)))) last = q; else break; }

      const lab = p.unit ? fmtUQ(p.q * f, p.unit) : `${fmtQty(p.q * f)} ${p.rest.split(/\s+/)[0]}`;

}

/* Lignes d'ingrédients d'une recette pour les courses : la liste si elle existe, sinon les quantités écrites dans les étapes */
function stepQtyLines(r){
  const out = [];
  (r.etapes || []).forEach(st => {
    const txt = String(st.instruction || ''), re = new RegExp(`(\\d+(?:[.,]\\d+)?|[½¼¾⅓⅔])\\s*(${STEP_UNITS})?(?![a-zà-ÿ0-9])\\s*(?:de\\s+|d['’]\\s*)?([a-zà-ÿœ'’]+(?:\\s+(?:de\\s+|d['’]\\s*)?[a-zà-ÿœ]+){0,3})`, 'gi');
    let m;
    while ((m = re.exec(txt))) {
      if (/(?:chaque|par|prendre|prends|déposer|dépose|y)\s*$/i.test(txt.slice(Math.max(0, m.index - 16), m.index))) continue;
      const cut = []; for (const w of m[3].split(/\s+/)) { if (STOPCUT.test(w)) break; cut.push(w); }
      const name = cut.join(' ').replace(/^(de\s+|d['’]\s*)/i, '').trim();
      if (!name || TIMEW.test(cut[0] || '')) continue;
      out.push(`${m[1]}${m[2] ? ' ' + m[2] : ''} de ${name}`);
    }
  });
  return out;
}
function shopSource(r){

/* Regroupe un même produit : pluriels, préparations (râpé, haché…), « blancs de poulet » = poulet, blanc/jaune d'œuf = œufs */
const PREP = ['rape', 'hache', 'emince', 'coupe', 'decoupe', 'epluche', 'pele', 'entier', 'cuit', 'cru', 'fondu', 'mixe', 'ecrase', 'concasse', 'frais', 'fraiche', 'fin', 'finement', 'gros', 'grosse', 'petit', 'petite'];
const TEMPW = ['chaud', 'froid', 'tiede', 'bouillant', 'glace'];
const MEASURE = /^(cuill?[eè]res?\s+(?:à|a)\s+(?:caf[eé]|soupe)|c\.?\s*(?:à|a)\s*[sc]\.?|pinc[ée]es?|sachets?|gousses?|verres?|tasses?|bo[iî]tes?|bottes?|brins?|pots?)\s+(?:de\s+|d['’]\s*)(.+)$/i;
function shopGroup(it){
  let name = it.name, q = it.q, base = it.base;
  const mm = String(name).match(MEASURE);
  if (mm && q != null && !base) { base = mm[1].toLowerCase().replace(/^c\.?\s*(?:à|a)\s*s\.?$/, 'c. à soupe').replace(/^c\.?\s*(?:à|a)\s*c\.?$/, 'c. à café'); name = cap(mm[2].trim()); }
  const n = norm(name).replace(/œ/g, 'oe');
  if (/\boeufs?\b/.test(n)) {
    if (q != null && (base === 'g' || base === 'ml')) q = Math.max(1, Math.round(q / (/\bblancs?\b/.test(n) ? 33 : /\bjaunes?\b/.test(n) ? 18 : 55)));
    else if (q != null && base) q = null;
    return { key:'oeuf', name:'Œufs', q, base:'', egg:true };
  }
  const kw = specKw(name).filter(w => !PREP.some(p => w.startsWith(p)));
  if (kw.includes('eau') && kw.every(w => w === 'eau' || TEMPW.some(p => w.startsWith(p)))) return null;
  const key = kw.length ? kw.filter(w => !TEMPW.some(p => w.startsWith(p))).sort().join(' ') || kw.sort().join(' ') : 'x|' + n;
  return { key, name, q, base };
}
function buildShop(){

  d.ingredients = d.ingredients.map(x => (x || '').trim()).filter(Boolean);
  d.materiel = (d.materiel || []).map(x => (x || '').trim()).filter(Boolean);
  d.etapes = d.etapes.map(e => ({ ...e, instruction:(e.instruction || '').trim(), ingredients:e.ingredients.map(x => (x || '').trim()).filter(Boolean), notes:e.notes.map(x => (x || '').trim()).filter(Boolean), materiel:(e.materiel || []).map(x => (x || '').trim()).filter(Boolean) })).filter(e => e.instruction);
}
function readRaw(){ const { recipe } = parse($('#rawtext').value, { lenient:true }); recipe.id = S.draft.id; S.draft = recipe; }
function dictateNote(s){
  const st = S.draft.etapes[s]; st.notes.push(''); const k = st.notes.length - 1; render();
  const ta = document.querySelector(`textarea[data-f="note"][data-s="${s}"][data-n="${k}"]`);
  if (!ta) return;
  ta.placeholder = 'Parle, je transcris…'; ta.focus();
  const rec = new SR(); rec.lang = 'fr-FR'; rec.interimResults = true; rec.continuous = false;
  rec.onresult = e => { let t = ''; for (const res of e.results) t += res[0].transcript; st.notes[k] = cap(t.trim()); ta.value = st.notes[k]; };
  rec.onerror = e => { if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(e.error)) toast('Micro refusé : écris la note au clavier.'); };
  rec.onend = () => { ta.placeholder = ''; };
  try { rec.start(); } catch (e) {}
}

/* ---------- Feuilles, messages, fichiers ---------- */
function sheet(html){
  closeSheet();
  const b = document.createElement('div'); b.className = 'backdrop'; b.id = 'sheet';
  b.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  b.addEventListener('click', e => { if (e.target === b) { closeSheet(); b._res && b._res(null); } });
  document.body.appendChild(b);
  const f = b.querySelector('textarea, input, button'); f && f.focus();
  return b;
}
function closeSheet(){ const s = $('#sheet'); if (s) s.remove(); }
function ask(title, msg, opts){
  return new Promise(res => {
    const b = sheet(`<h3>${esc(title)}</h3>${msg ? `<p>${esc(msg)}</p>` : ''}<div class="acts">${opts.map((o, i) => `<button class="btn ${o.kind || ''}" data-ans="${i}">${esc(o.label)}</button>`).join('')}</div>`);
    b._res = res;
    b.addEventListener('click', e => { const a = e.target.closest('[data-ans]'); if (a) { closeSheet(); res(opts[+a.dataset.ans].value); } });
  });
}
let toastT;
function toast(m){
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = m; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600);
}

let dlP = null;
function getDl(){
  if (!dlP) dlP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  return dlP;
}
async function exportText(name, text){
  const dl = await getDl();
  if (!dl) {
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type:'text/plain;charset=utf-8' }));
      a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      toast('Fichier enregistré dans Téléchargements'); return;
    } catch (e) {}
  }
  if (dl) {
    try { await dl.save({ filename:name, data:text }); toast('Fichier enregistré'); return; }
    catch (e) {
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited') { toast('Un enregistrement est déjà en cours.'); return; }
    }
  }
  sheet(`<h3>${esc(name)}</h3><p>Copie ce texte dans un fichier qui se termine par .recette.txt :</p><textarea class="raw" readonly>${esc(text)}</textarea><div class="acts"><button class="btn primary" data-act="copy">Copier le texte</button><button class="btn" data-act="close-sheet">Fermer</button></div>`);
}
const fileInput = document.createElement('input');
fileInput.type = 'file'; fileInput.accept = '.txt,text/plain'; fileInput.multiple = true; fileInput.hidden = true;
document.body.appendChild(fileInput);
fileInput.addEventListener('change', () => { const files = [...fileInput.files]; fileInput.value = ''; importFiles(files); });
async function importFiles(files){
  let ok = 0; const errs = [];
  for (const f of files) {
    try {
      const { recipe } = parse(await f.text());
      const same = S.recipes.find(r => norm(r.titre) === norm(recipe.titre));
      if (same) {
        const a = await ask(`« ${recipe.titre} » existe déjà`, 'Que faire du fichier importé ?', [{ label:'Remplacer', value:'r', kind:'primary' }, { label:'Garder les deux', value:'k' }, { label:'Ignorer ce fichier', value:null }]);
        if (a === 'r') { recipe.id = same.id; S.recipes[S.recipes.indexOf(same)] = recipe; ok++; }
        else if (a === 'k') { recipe.id = uid(); recipe.titre = uniqueTitle(recipe.titre); S.recipes.push(recipe); ok++; }
      } else { recipe.id = uid(); S.recipes.push(recipe); ok++; }
    } catch (e) { errs.push(`${f.name} : ${e.message}`); }
  }
  persist(); render();
  if (errs.length) sheet(`<h3>Certains fichiers n’ont pas été importés</h3><ul>${errs.map(x => `<li>${esc(x)}</li>`).join('')}</ul><div class="acts"><button class="btn" data-act="close-sheet">Fermer</button></div>`);
  else if (ok) toast(ok > 1 ? `${ok} recettes importées` : 'Recette importée');
}

async function restoreFile(file, mode){

  let st = null;

  if (st) sheet(`<h3>Fusion terminée</h3><ul class="gaps" style="color:var(--ink)"><li>${plural(st.nouveaux, 'élément')} ${st.nouveaux > 1 ? 'ajoutés' : 'ajouté'}</li><li>${plural(st.maj, 'élément')} ${st.maj > 1 ? 'mis' : 'mis'} à jour (version plus récente)</li><li>${plural(st.suppr, 'élément')} ${st.suppr > 1 ? 'supprimés' : 'supprimé'} (effacés sur l’autre téléphone)</li></ul><p>En cas de souci, Paramétrage → « Points de restauration » permet de revenir à l’état d’avant.</p><div class="acts"><button class="btn" data-act="close-sheet">Compris</button></div>`);

}

const IDBX = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('pasapas', 2);
    r.onupgradeneeded = () => { const db = r.result; ['photos', 'kv', 'snaps'].forEach(n => { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n); }); };
    r.onsuccess = () => res(r.result); r.onerror = () => { p = null; rej(r.error); };
  }));
  const tx = async (st, mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction(st, mode), rq = fn(t.objectStore(st)); t.oncomplete = () => res(rq ? rq.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  const api = st => ({ put:(k, v) => tx(st, 'readwrite', s => s.put(v, k)), get:k => tx(st, 'readonly', s => s.get(k)), del:k => tx(st, 'readwrite', s => s.delete(k)), keys:() => tx(st, 'readonly', s => s.getAllKeys()) });
  return { photos:api('photos'), kv:api('kv'), snaps:api('snaps') };
})();
const IDB = IDBX.photos;
const photoURLs = {};
function compressImage(file, max = 1600, q = 0.82){
  return new Promise(res => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b => res(b), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}
async function attachPhotos(files){

function profitGroups(){
  const smic = S.settings.smic > 0 ? S.settings.smic : 12.31, fh = S.settings.forfaitH >= 0 ? S.settings.forfaitH : 3;
  const done = S.orders.filter(o => o.statut === 'livree').map(o => ({ o, t:orderTime(o) })).filter(x => x.t != null).sort((a, b) => a.t - b.t);
  const groups = [];
  done.forEach(x => { const g = groups[groups.length - 1]; if (g && x.t - g.start <= 3 * DAY) { g.items.push(x.o); g.end = x.t; } else groups.push({ start:x.t, end:x.t, items:[x.o] }); });
  const used = new Set();
  groups.forEach(g => {
    g.cooks = (S.cooks || []).filter(k => { const t = new Date(k.fin).getTime(); if (used.has(k.id) || isNaN(t) || t < g.start - 3 * DAY || t > g.end + DAY) return false; used.add(k.id); return true; });
    let ca = 0, dep = 0, miss = 0, estS = 0; const byR = {};
    g.items.forEach(o => (o.lignes || []).forEach(l => { const r = find(l.rid), q = +l.qte || 0, pu = l.pu > 0 ? l.pu : (r && r.prixVente > 0 ? r.prixVente : 0); ca += pu * q; byR[l.rid] = (byR[l.rid] || 0) + q; }));

function vOrderEdit(){
  const o = S.odraft, isNew = !findOrder(o.id);
  const cl = [...S.clients].sort((a, b) => clientName(a).localeCompare(clientName(b), 'fr'));
  const rs = [...S.recipes].sort((a, b) => a.titre.localeCompare(b.titre, 'fr'));
  return `<div class="topbar"><button class="btn ghost" data-act="order-back">‹ Annuler</button><h2>${isNew ? 'Nouvelle commande' : 'Modifier la commande'}</h2></div>
  <label class="lbl">Client<select id="o-client"><option value="">Choisir un client…</option>${cl.map(c => `<option value="${c.id}" ${c.id === o.clientId ? 'selected' : ''}>${esc(clientName(c))}</option>`).join('')}</select></label>
  <div class="row-btns"><button class="btn mini" data-act="client-new" data-from="orderEdit">Nouveau client</button></div>
  <label class="lbl">Date de livraison ou de retrait (facultatif)<input id="o-date" type="date" value="${esc(o.livraison || '')}"></label>
  <h3 class="sub">Quantités par recette</h3>
  ${rs.length ? rs.map(r => `<div class="oline"><div><b>${esc(r.titre)}</b><small>${r.prixVente > 0 ? `${fmtEuro(r.prixVente)} l’unité` : 'Pas de prix de vente'}${r.portions ? `, recette pour ${r.portions}` : ''}</small><small class="olt" id="olt-${r.id}">${r.prixVente > 0 && o.q[r.id] > 0 ? `= ${fmtEuro(r.prixVente * o.q[r.id])}` : ''}</small></div><input class="porin small" type="number" inputmode="numeric" min="0" data-oq="${r.id}" value="${o.q[r.id] || ''}" placeholder="0" aria-label="Quantité de ${esc(r.titre)}"></div>`).join('') : '<p class="hint">Aucune recette : crée d’abord une recette.</p>'}
  <div class="totals"><span>Total de la commande</span><b id="o-total">${fmtEuro(Object.entries(o.q).reduce((a, [rid, n]) => { const r = find(rid); return a + (r && r.prixVente > 0 ? r.prixVente * n : 0); }, 0))}</b></div>
  <label class="lbl">Note<textarea id="o-note" rows="2" placeholder="Retrait à 18 h, sans coriandre…">${esc(o.note || '')}</textarea></label>
  <div class="savebar"><button class="btn primary" data-act="order-save">Enregistrer la commande</button></div>`;
}
function captureOrderDraft(){
  const o = S.odraft; if (!o) return;
  const v = id => ($('#' + id) || {}).value;
  if (v('o-client') != null) o.clientId = v('o-client');
  if (v('o-date') != null) o.livraison = v('o-date');
  if (v('o-note') != null) o.note = v('o-note');
  document.querySelectorAll('[data-oq]').forEach(el => { const n = parseFloat(String(el.value).replace(',', '.')); if (n > 0) o.q[el.dataset.oq] = n; else delete o.q[el.dataset.oq]; });
}
function vHistory(){
  const f = S.hist || (S.hist = { client:'', statut:'' });
  const list = S.orders.filter(o => (!f.client || o.clientId === f.client) && (!f.statut || o.statut === f.statut)).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const cl = [...S.clients].sort((a, b) => clientName(a).localeCompare(clientName(b), 'fr'));
  const tot = list.filter(o => o.statut !== 'annulee').reduce((a, o) => a + (o.lignes || []).reduce((x, l) => x + (+l.qte || 0), 0), 0);
  return `<div class="topbar"><button class="btn ghost" data-act="go-orders">‹ Commandes</button><h2>Historique</h2></div>
  <div class="row-btns" style="margin-top:0"><button class="btn primary" data-act="go-profit" style="flex:1">Rentabilité</button></div>
  <div class="tgrid" style="grid-template-columns:1fr 1fr"><label class="lbl">Client<select data-hist="client"><option value="">Tous les clients</option>${cl.map(c => `<option value="${c.id}" ${f.client === c.id ? 'selected' : ''}>${esc(clientName(c))}</option>`).join('')}</select></label>
  <label class="lbl">État<select data-hist="statut">${[['', 'Tous'], ['attente', 'En attente'], ['livree', 'Livrées'], ['annulee', 'Annulées']].map(([k, l]) => `<option value="${k}" ${f.statut === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
  <p class="hint">${plural(list.length, 'commande')}, ${pcs(tot)} (hors annulées).</p>
  ${list.length ? list.map(orderCard).join('') : '<div class="empty"><p>Aucune commande pour ce filtre.</p></div>'}`;
}
function vClientEdit(){
  const c = S.cdraft, isNew = !findClient(c.id);
  const f = (id, label, v, type = 'text', ph = '') => `<label class="lbl">${label}<input id="${id}" type="${type}" value="${esc(v || '')}" placeholder="${ph}" autocomplete="off"></label>`;
  const links = [['instagram', 'Instagram'], ['facebook', 'Facebook'], ['tiktok', 'TikTok']].map(([n, l]) => { const u = socialUrl(n, c[n]); return u ? `<a class="btn mini" href="${esc(u)}" target="_blank" rel="noopener">${l}</a>` : ''; }).join('');
  const orders = isNew ? [] : S.orders.filter(o => o.clientId === c.id).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  return `<div class="topbar"><button class="btn ghost" data-act="client-back">‹ Annuler</button><h2>${isNew ? 'Nouveau client' : 'Fiche client'}</h2></div>
  ${f('c-prenom', 'Prénom', c.prenom)}${f('c-nom', 'Nom', c.nom)}
  <label class="lbl">Adresse<textarea id="c-adresse" rows="2">${esc(c.adresse || '')}</textarea></label>
  ${f('c-tel', 'Téléphone', c.tel, 'tel', '06 12 34 56 78')}${f('c-email', 'E-mail', c.email, 'email')}
  <h3 class="sub">Réseaux sociaux</h3>
  ${f('c-instagram', 'Instagram', c.instagram, 'text', '@pseudo ou lien')}${f('c-facebook', 'Facebook', c.facebook, 'text', 'Nom du profil ou lien')}${f('c-tiktok', 'TikTok', c.tiktok, 'text', '@pseudo')}${f('c-autre', 'Autre (Snapchat, WhatsApp…)', c.autre)}
  <label class="lbl">Notes<textarea id="c-notes" rows="2" placeholder="Allergies, préférences…">${esc(c.notes || '')}</textarea></label>
  ${!isNew && (c.tel || links) ? `<div class="row-btns" style="margin-top:14px">${c.tel ? `<a class="btn mini" href="tel:${telHref(c.tel)}">Appeler</a><a class="btn mini" href="sms:${telHref(c.tel)}">SMS</a>` : ''}${links}</div>` : ''}
  ${!isNew ? `<h3 class="sub">Ses commandes${orders.length ? ` (${orders.length})` : ''}</h3>${orders.length ? orders.map(orderCard).join('') : '<p class="hint">Aucune commande pour l’instant.</p>'}
  <div class="row-btns"><button class="btn" data-act="order-new" data-id="${c.id}" style="flex:1">Nouvelle commande</button><button class="btn danger" data-act="client-del" data-id="${c.id}">Supprimer le client</button></div>` : ''}
  <div class="savebar"><button class="btn primary" data-act="client-save">Enregistrer le client</button></div>`;
}

S.clients = []; S.orders = []; S.prices = []; S.cooks = [];
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => {
  await dbInit();
  S.settings = Object.assign({ lire:true, autoMinuteur:true, lireNotes:false, smic:12.31, forfaitH:3 }, load(SKEY, {}));
  S.clients = load(CKEY, []); S.orders = load(OKEY, []); S.prices = load(PKEY, []); S.cooks = load(CLKEY, []);
  loadRecipes();
  render();
  initPhoto();
  if (KV.migrated) toast('Tes données sont maintenant dans la base de données du téléphone');
})();
</script>
</body>
</html>
