<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pas à pas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E5B45">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EB; --surface:#FFFFFF; --ink:#1D2A23; --muted:#55665C; --line:#D2DBD4;
  --herb:#2E5B45; --herb-ink:#FFFFFF; --saffron:#DE9C0C; --saffron-soft:#F6E2AE;
  --alert:#B5380F; --alert-ink:#FFFFFF; --scrim:rgba(12,18,15,.45);
  --f-body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-head:'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif;
  --f-mono:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121814; --surface:#1B231E; --ink:#ECF1EC; --muted:#A0B1A6; --line:#2E3A33;
    --herb:#80C09B; --herb-ink:#0E1912; --saffron:#F2B632; --saffron-soft:#3B3013;
    --alert:#F07444; --alert-ink:#1C0D06; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1B231E; --ink:#ECF1EC; --muted:#A0B1A6; --line:#2E3A33;
  --herb:#80C09B; --herb-ink:#0E1912; --saffron:#F2B632; --saffron-soft:#3B3013;
  --alert:#F07444; --alert-ink:#1C0D06; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:20px 18px 130px}
body[data-screen="cook"] #app{padding-bottom:170px}
h1,h2,h3{font-family:var(--f-head);line-height:1.08;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:17px;text-align:center}
.btn.primary{background:var(--herb);color:var(--herb-ink);border-color:var(--herb)}
.btn.danger{color:var(--alert)}
.btn.ghost{background:transparent;border-color:transparent;padding:8px 10px;min-height:44px}
.btn.mini{min-height:42px;padding:6px 14px;font-size:15px;border-radius:11px}
.btn[disabled]{opacity:.4;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.iconbtn[disabled]{opacity:.35;cursor:default}
.hint{color:var(--muted);font-size:16px;margin:14px 0}
.stack{display:flex;flex-direction:column;gap:10px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sec{font-size:21px;margin:36px 0 12px}
.sub{font-size:21px;margin:26px 0 10px}

/* Accueil */
.hero{margin:18px 0 28px}
.hero h1{font-size:clamp(52px,16vw,84px);font-weight:800;letter-spacing:-.025em;line-height:.92}
.hero h1 span{display:block}
.hero h1 span:nth-child(2){padding-left:.85em}
.hero h1 span:nth-child(3){padding-left:1.7em}
.hero p{color:var(--muted);margin-top:18px;font-size:19px}
.choice{display:block;width:100%;text-align:left;padding:22px 20px;border-radius:22px;margin-bottom:14px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface)}
.choice.launch{background:var(--herb);color:var(--herb-ink);border-color:var(--herb)}
.choice strong{display:block;font-family:var(--f-head);font-size:29px;font-weight:800;line-height:1.1}
.choice span{display:block;margin-top:4px;font-size:16px;opacity:.85}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1.5px solid var(--line);cursor:pointer}
.toggle input{width:26px;height:26px;accent-color:var(--herb);flex:none}

/* Barres de titre */
.topbar{display:flex;align-items:center;gap:6px;margin:-4px -8px 16px}
.topbar h2{font-size:25px;flex:1}

/* Liste */
.search{width:100%;margin-bottom:14px}
.rrow{display:flex;align-items:center;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;padding-right:8px}
.rrow .main{flex:1;text-align:left;background:none;border:none;padding:16px;cursor:pointer;min-height:68px}
.rrow .main b{display:block;font-size:21px;line-height:1.2}
.rrow .main small{display:block;color:var(--muted);font-size:15px;margin-top:3px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}

/* Champs */
input,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{resize:vertical;min-height:64px;line-height:1.4}
input.short{max-width:120px}
.lbl{display:block;font-weight:700;font-size:15px;color:var(--muted);margin:16px 0 0}
.lbl input,.lbl textarea{margin-top:6px;font-weight:400;color:var(--ink)}
.tabs{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{flex:1;border:none;background:none;border-radius:10px;min-height:44px;font-weight:700;cursor:pointer;font-size:16px}
.tabs button[aria-pressed="true"]{background:var(--herb);color:var(--herb-ink)}
.error{background:var(--saffron-soft);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:16px}
.ingrow,.noterow{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.stepcard{border:1.5px solid var(--line);border-radius:18px;padding:14px;margin:14px 0;background:var(--surface)}
.stepcard input,.stepcard textarea{background:var(--bg)}
.sc-head{display:flex;align-items:center;gap:6px}
.sc-head .num{font-family:var(--f-head);font-weight:800;font-size:22px;flex:1}
.timeinputs{display:flex;gap:8px;align-items:center;margin-top:6px;color:var(--ink);font-weight:400}
.timeinputs input{width:84px;margin:0}
.reels{font-size:14px;color:var(--muted);margin-top:10px}
.raw{font-family:var(--f-mono);font-size:15px;line-height:1.55;min-height:58vh;margin-top:14px}
.savebar,.cookbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1.5px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
.savebar .btn{flex:1;max-width:320px}

/* Cuisson */
.cook-top{display:flex;align-items:center;gap:8px;margin:-4px -8px 0}
.mic{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:6px 14px;min-height:42px;font-weight:700;font-size:15px;cursor:pointer}
.mic .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.mic.on{border-color:var(--herb)}
.mic.on .dot{background:var(--herb);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.heard{font-size:15px;color:var(--muted);min-height:22px;margin-top:6px}
.progress{height:6px;background:var(--line);border-radius:6px;margin:12px 0 20px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--herb);border-radius:6px}
.stepno{font-family:var(--f-head);font-weight:800;font-size:18px;color:var(--muted)}
.instr{font-size:clamp(27px,7.4vw,38px);line-height:1.22;font-weight:700;margin:8px 0 18px;white-space:pre-line;font-family:var(--f-body)}
h2.instr{font-family:var(--f-head);font-weight:800}
.desc{font-size:19px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;font-size:17px}
.notebox{border-left:5px solid var(--saffron);background:var(--surface);padding:10px 14px;border-radius:0 12px 12px 0;margin:8px 0;font-size:19px}
.inglist{padding-left:24px;font-size:21px;margin:0}
.inglist li{margin:6px 0}
.timer{display:flex;align-items:center;gap:18px;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:16px;margin:16px 0}
.dial{position:relative;width:136px;height:136px;flex:none}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .track{stroke:var(--line)}
.dial .fill{stroke:var(--saffron);transition:stroke-dashoffset .25s linear}
.dial .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-weight:800;font-size:31px;font-variant-numeric:tabular-nums}
.timer.done .dial .fill{stroke:var(--alert)}
.timer .tlabel{font-size:15px;color:var(--muted);margin-bottom:10px}
.timer .ctl{display:flex;flex-wrap:wrap;gap:8px}
.past{font-size:16px;color:var(--muted);margin-top:4px}
.next{color:var(--muted);font-size:17px;margin-top:22px}
.cookbar .done-btn{flex:1;max-width:440px;min-height:66px;font-size:23px;font-family:var(--f-head);font-weight:800;border-radius:18px}
.cookbar .back-btn{min-width:66px;min-height:66px;font-size:24px;border-radius:18px}
.alarm{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;max-width:616px;margin:0 auto;background:var(--alert);color:var(--alert-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.alarm b{font-family:var(--f-head);font-size:26px;line-height:1.1}
.alarm .row2{display:flex;gap:8px}
.alarm .btn{flex:1;background:var(--alert-ink);color:var(--alert);border:none}
.notepanel{position:fixed;left:12px;right:12px;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:15;max-width:616px;margin:0 auto;background:var(--surface);border:2px solid var(--saffron);border-radius:20px;padding:16px;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.notepanel b{font-family:var(--f-head);font-size:21px}
.notepanel p{margin:8px 0;font-size:18px}
.notepanel .muted{color:var(--muted);font-size:15px}
.notepanel textarea{margin:8px 0}

/* Portions et courses */
.stepper{display:flex;align-items:center;gap:16px;margin:10px 0 6px}
.stepper output{font-family:var(--f-head);font-weight:800;font-size:46px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.stepper .unit{color:var(--muted);font-size:16px}
.iconbtn.big{width:58px;height:58px;font-size:28px;border-radius:16px}
.porhint{color:var(--muted);font-size:16px}
.totals{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin:16px 0 4px}
.totals b{font-family:var(--f-head);font-size:26px;font-weight:800}
.shoprow{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;padding:12px 14px}
.shoprow.on{border-color:var(--herb)}
.pick{display:flex;gap:12px;align-items:center;cursor:pointer}
.pick input,.shoplist input{width:24px;height:24px;accent-color:var(--herb);flex:none;margin:0;padding:0}
.pick b{display:block;font-size:19px;line-height:1.25}
.pick small{display:block;color:var(--muted);font-size:15px}
.shoprow .stepper{margin:10px 0 2px 36px;gap:12px}
.shoprow .stepper output{font-size:28px}
.shoplist{list-style:none;padding:0;margin:0}
.shoplist label{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1.5px solid var(--line);font-size:18px;cursor:pointer}
.shoplist .off span{text-decoration:line-through;color:var(--muted)}

/* Dictée, matériel */
.withmic{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
.withmic input,.withmic textarea{margin:0}
.iconbtn.rec{background:var(--alert);color:var(--alert-ink);border-color:var(--alert)}
.btn svg,.iconbtn svg{flex:none}
.chips .chiplab{font-size:14px;font-weight:700;color:var(--muted);align-self:center;margin-right:2px}
.chip.tool{border-style:dashed}
.matrow{margin:14px 0}
.matname{display:block;font-weight:700;font-size:18px;margin-bottom:6px}
.gaps{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:16px}
.gaps li{margin:3px 0}

/* Récap */
.recap-h{font-size:clamp(44px,13vw,68px);font-weight:800;letter-spacing:-.02em;margin:22px 0 10px}
.scroll{overflow-x:auto;margin:20px 0}
table.recap{width:100%;border-collapse:collapse}
.recap th,.recap td{padding:11px 6px;border-bottom:1.5px solid var(--line);text-align:left;font-size:16px;vertical-align:top}
.recap th{color:var(--muted);font-weight:700}
.recap .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.recap tfoot td{font-weight:700;border-bottom:none}

/* Feuilles et messages */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet h3{font-size:23px;margin-bottom:8px}
.sheet p{color:var(--muted);margin:6px 0}
.sheet ul{padding-left:20px}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sheet .raw{min-height:40vh;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:40;font-size:16px;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
@media (prefers-reduced-motion: reduce){.mic.on .dot{animation:none}.dial .fill{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<div id="alarm-host"></div>
<div id="note-host"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[’]/g, "'").toLowerCase().trim();
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const plural = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;

/* ---------- Stockage local (un texte à marqueurs par recette) ---------- */
const KEY = 'pasapas:recettes', SKEY = 'pasapas:reglages';
function load(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* ---------- Durées ---------- */
function parseDuration(v){
  const s = norm(v).replace(/,/g, '.');
  if (!s) return null;
  const re = /(\d+(?:\.\d+)?)\s*(heures?|h|minutes?|min|mn|m|secondes?|sec|s)?/g;
  let total = 0, prev = null, found = false, m;
  while ((m = re.exec(s))) {
    found = true;
    const n = parseFloat(m[1]);
    let u = m[2] || (prev === 'h' ? 'min' : prev === 'min' ? 's' : 'min');
    if (u.startsWith('h')) { total += n * 3600; prev = 'h'; }
    else if (u.startsWith('s')) { total += n; prev = 's'; }
    else { total += n * 60; prev = 'min'; }
  }
  return found ? Math.round(total) : null;
}
function fmtDur(sec){
  if (sec == null) return '';
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60, p = [];
  if (h) p.push(`${h} h`);
  if (m) p.push(`${m} min`);
  if (s || !p.length) p.push(`${s} s`);
  return p.join(' ');
}
function fmtClock(sec){
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60, two = x => String(x).padStart(2, '0');
  return h ? `${h}:${two(m)}:${two(s)}` : `${two(m)}:${two(s)}`;
}
function fmtSpeech(sec){
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec / 60), s = sec % 60, p = [];
  if (m) p.push(plural(m, 'minute'));
  if (s || !p.length) p.push(plural(s, 'seconde'));
  return p.join(' et ');
}

/* ---------- Quantités ---------- */
const UNITS = { g:['g',1], gr:['g',1], grammes:['g',1], kg:['g',1000], mg:['g',.001], l:['ml',1000], litre:['ml',1000], litres:['ml',1000], dl:['ml',100], cl:['ml',10], ml:['ml',1] };
const FRAC = { '½':.5, '¼':.25, '¾':.75, '⅓':1/3, '⅔':2/3 };
function splitQty(txt){
  const m = String(txt).trim().match(/^(\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?|[½¼¾⅓⅔])\s*(.*)$/);
  if (!m) return null;
  const a = m[1]; let q;
  if (FRAC[a]) q = FRAC[a];
  else if (a.includes('/')) { const [x, y] = a.split('/').map(v => parseFloat(v.replace(',', '.'))); q = y ? x / y : x; }
  else q = parseFloat(a.replace(',', '.'));
  let rest = m[2], unit = '';
  const um = rest.match(/^([a-zA-Zéè]+)\.?(?=\s|$)\s*(.*)$/);
  if (um && UNITS[um[1].toLowerCase()]) { unit = um[1]; rest = um[2]; }
  return { q, unit, rest };
}
function fmtQty(n){ const r = n >= 10 ? Math.round(n) : Math.round(n * 10) / 10; return String(r).replace('.', ','); }
function scaleIngr(txt, f){
  if (f === 1) return txt;
  const p = splitQty(txt); if (!p) return txt;
  return `${fmtQty(p.q * f)}${p.unit ? ' ' + p.unit : ''} ${p.rest}`.trim();
}
function shopItem(txt, f){
  const p = splitQty(txt);
  if (!p) return { key:'x|' + norm(txt), name:cap(String(txt).trim()), q:null, base:'' };
  const name = p.rest.replace(/^(de |des |d'|d’)/i, '').trim();
  let base = '', q = p.q * f;
  if (p.unit) { const [b, mul] = UNITS[p.unit.toLowerCase()]; base = b; q *= mul; }
  return { key:base + '|' + norm(name), name:cap(name), q, base };
}
function fmtShopQty(q, base){
  if (base === 'g') return q >= 1000 ? `${fmtQty(q / 1000)} kg` : `${fmtQty(q)} g`;
  if (base === 'ml') return q >= 1000 ? `${fmtQty(q / 1000)} l` : q >= 100 ? `${fmtQty(q / 10)} cl` : `${fmtQty(q)} ml`;
  return fmtQty(q);
}

/* ---------- Format texte à marqueurs ---------- */
const MARKERS = { 'recette':1, 'description':1, 'portions':1, 'ingredient':1, 'ingredients':1, 'etape':1, 'temps':1, 'temps reel':1, 'temps reels':1, 'note':1, 'materiel':1, 'ecart materiel':1, 'ecart':1 };
function parse(text, opts = {}){
  const lines = String(text).replace(/\r/g, '').split('\n');
  const r = { titre:'', description:'', portions:null, ingredients:[], materiel:[], etapes:[], ecarts:[] };
  let cur = null, last = null;
  const append = (val) => {
    if (!last) return false;
    if (last.arr) last.arr[last.i] = (last.arr[last.i] ? last.arr[last.i] + '\n' : '') + val;
    else last.o[last.f] = (last.o[last.f] ? last.o[last.f] + '\n' : '') + val;
    return true;
  };
  lines.forEach((line, idx) => {
    const ln = idx + 1;
    if (!line.trim()) return;
    const m = line.match(/^\s*([^:]{2,24}?)\s*:\s?(.*)$/);
    const k = m ? norm(m[1]) : '';
    if (!m || !MARKERS[k]) { append(line.trim()); return; }
    const v = m[2].trim();
    if (k === 'recette') { r.titre = v; last = { o:r, f:'titre' }; }
    else if (k === 'description') { r.description = v; last = { o:r, f:'description' }; }

function tAdd(){
  const c = S.cook; if (!c || c.i < 0) return;
  if (!c.t) { c.t = { base:60, total:60, remaining:60, endAt:0, running:false, done:false }; render(); return tStart(); }
  const t = c.t;
  if (c.alarm || t.done) { stopAlarm(); t.done = false; t.total = 60; t.remaining = 60; t.running = false; return tStart(); }
  if (t.running) t.endAt += 60000; else t.remaining += 60;
  t.total += 60; updTimer(true);
}
function tReset(){ const t = S.cook && S.cook.t; if (!t) return; stopAlarm(); t.running = false; t.done = false; t.total = t.base; t.remaining = t.base; updTimer(true); }
const RING = 2 * Math.PI * 54;
function ctlHtml(t){
  const main = t.running ? `<button class="btn mini primary" data-act="t-pause">Pause</button>`
    : `<button class="btn mini primary" data-act="t-start">${t.done ? 'Relancer' : t.remaining < t.total ? 'Reprendre' : 'Démarrer'}</button>`;
  return `${main}<button class="btn mini" data-act="t-add">+1 min</button><button class="btn mini" data-act="t-reset">Réinitialiser</button>`;
}
function updTimer(controls){
  const c = S.cook; if (!c || !c.t || S.screen !== 'cook') return;
  const t = c.t, val = $('#tval'), fill = $('#tfill'), box = $('#timer');
  if (!val) return;
  val.textContent = fmtClock(t.remaining);
  fill.setAttribute('stroke-dashoffset', String(RING * (1 - Math.max(0, Math.min(1, t.remaining / t.total)))));
  box.classList.toggle('done', t.done);
  if (controls) $('#tctl').innerHTML = ctlHtml(t);
}
setInterval(() => {
  const c = S.cook; if (!c || !c.t || !c.t.running) return;
  const rem = (c.t.endAt - Date.now()) / 1000;
  if (rem <= 0) { c.t.running = false; c.t.remaining = 0; c.t.done = true; updTimer(true); startAlarm(); }
  else { c.t.remaining = rem; updTimer(false); }
}, 250);

/* Alerte */
function ring(){ beep(880, .18); setTimeout(() => beep(880, .18), 260); try { navigator.vibrate && navigator.vibrate([260, 120, 260]); } catch (e) {} }
function startAlarm(){
  const c = S.cook; if (!c || c.alarm) return;
  c.alarm = true; renderAlarm(); ring();
  c.alarmIv = setInterval(ring, 1600);
  say('Le temps imparti est écoulé.', true);
  c.alarmSay = setInterval(() => say('Le temps imparti est écoulé.', true), 12000);
}
function stopAlarm(){
  const c = S.cook; if (!c) return;
  clearInterval(c.alarmIv); clearInterval(c.alarmSay);
  if (c.alarm) { c.alarm = false; hush(); }
  renderAlarm();
}
function renderAlarm(){
  const host = $('#alarm-host'), c = S.cook;
  host.innerHTML = c && c.alarm && S.screen === 'cook' ? `<div class="alarm" role="alert"><b>Le temps imparti est écoulé</b><span>L’étape reste affichée : dis « étape terminée » quand tu as fini.</span><div class="row2"><button class="btn" data-act="alarm-stop">Arrêter l’alerte</button><button class="btn" data-act="t-add">+1 min</button></div></div>` : '';
}

/* Annotations dictées en cuisson */
function startNote(){
  const c = S.cook;
  if (c.i < 0) return say('Commence d’abord une étape pour y ajouter une note.', true);
  if (!SR || V.state !== 'on') { typeNoteSheet(); return; }
  hush(); c.note = { mode:'listen', text:'', timer:null };
  renderNote(); armNoteSilence(5000);
}
function armNoteSilence(ms = 3500){ const c = S.cook; clearTimeout(c.note.timer); c.note.timer = setTimeout(endNoteListen, ms); }
function endNoteListen(){
  const c = S.cook; if (!c.note) return;
  clearTimeout(c.note.timer);
  if (!c.note.text) { c.note = null; renderNote(); toast('Note vide : rien n’a été ajouté.'); return; }
  c.note.mode = 'review'; c.note.text = cap(c.note.text);
  c.note.timer = setTimeout(keepNote, 5000); renderNote();
}
function keepNote(){
  const c = S.cook; if (!c || !c.note) return;
  clearTimeout(c.note.timer);
  const text = c.note.text.trim(); c.note = null; renderNote();
  if (!text) return;
  c.r.etapes[c.i].notes.push(text); persist(); render(); toast('Note ajoutée à l’étape');
}
function cancelNote(silent){
  const c = S.cook; if (!c || !c.note) return;
  clearTimeout(c.note.timer); c.note = null; renderNote();
  if (!silent) toast('Note annulée');
}
function renderNote(){
  const host = $('#note-host'), c = S.cook;
  if (!c || !c.note || S.screen !== 'cook') { host.innerHTML = ''; return; }
  host.innerHTML = c.note.mode === 'listen'
    ? `<div class="notepanel" aria-live="polite"><b>Je t’écoute</b><p>${esc(c.note.text) || '…'}</p><p class="muted">Dis « fin de note » ou fais une pause pour terminer.</p><div class="row-btns"><button class="btn mini primary" data-act="note-end">Terminer</button><button class="btn mini" data-act="note-cancel">Annuler</button></div></div>`
    : `<div class="notepanel"><b>Note à ajouter</b><textarea data-f="notetext" rows="3">${esc(c.note.text)}</textarea><p class="muted" id="auto-hint">Ajout automatique dans 5 s, ou dis « OK ». Touche le texte pour le corriger.</p><div class="row-btns"><button class="btn mini primary" data-act="note-keep">Garder</button><button class="btn mini" data-act="note-cancel">Annuler</button></div></div>`;
}
function typeNoteSheet(){
  sheet(`<h3>Ajouter une note</h3><p>Elle sera enregistrée avec cette étape.</p><textarea id="typenote" rows="4"></textarea><div class="acts"><button class="btn primary" data-act="typenote-add">Ajouter la note</button><button class="btn" data-act="close-sheet">Annuler</button></div>`);
}

function buildShop(){
  const map = new Map(), used = [];
  Object.entries(S.shop.sel).forEach(([id, p]) => {
    const r = find(id); if (!r) return;
    used.push(`${r.titre} (${plural(p, 'portion')})`);
    const f = p / (r.portions || 1);
    allIngr(r).forEach(x => { const it = shopItem(x, f), cur = map.get(it.key); if (cur) { if (cur.q != null && it.q != null) cur.q += it.q; } else map.set(it.key, it); });
  });
  return { used, items:[...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'fr')) };
}

Description : une phrase, seulement si la photo en donne une

Ingrédient : quantité en chiffres, unité et nom (une ligne par ingrédient, ex. « 320 g de riz », « 2 œufs »)

Temps : durée de l'étape qui précède (ex. 5 min, 1 h 30, 45 s), seulement si la recette l'indique pour cette étape
Note : une astuce ou remarque de la recette liée à l'étape qui précède

Règles : un marqueur par ligne, une ligne vide entre deux étapes, garde l'ordre des étapes, n'invente aucune quantité ni durée absente de la photo. Plusieurs photos forment une seule recette, dans l'ordre donné. Si aucune recette n'est lisible, réponds seulement : AUCUNE RECETTE`;
async function readPhoto(files){
  const smp = await getSample(); if (!smp) return;
  const ctl = new AbortController(); S.phCtl = ctl;
  sheet(`<h3>Lecture ${files.length > 1 ? 'des photos' : 'de la photo'}</h3><p id="ph-st">Claude lit la recette, cela peut prendre une minute…</p><textarea class="raw" id="ph-out" readonly aria-label="Texte lu sur la photo"></textarea><div class="acts"><button class="btn" data-act="ph-cancel">Annuler</button></div>`);
  try {
    const { text } = await smp(PHOTO_PROMPT, { images:files, signal:ctl.signal, onText:({ text }) => { const o = $('#ph-out'), st = $('#ph-st'); if (o) { o.value = text; o.scrollTop = o.scrollHeight; } if (st) st.textContent = 'Transcription en cours…'; } });
    if (ctl.signal.aborted || S.screen !== 'editor') return;
    const raw = String(text).replace(/```[a-z]*\n?/gi, '').trim();
    if (/^AUCUNE RECETTE/i.test(raw)) throw { code:'empty' };
    const { recipe } = parse(raw, { lenient:true });
    if (!recipe.titre && !recipe.etapes.length) throw { code:'empty' };
    const old = S.draft || {};
    recipe.id = old.id || null; recipe.ecarts = old.ecarts || [];
    if (!recipe.ingredients.length && !recipe.etapes.some(e => e.ingredients.length)) recipe.ingredients.push('');
    if (!recipe.etapes.length) recipe.etapes.push(blankStep());
    S.draft = recipe; S.tab = 'form';
    S.editErr = 'Recette lue depuis la photo : vérifie les quantités, les temps et les étapes avant d’enregistrer.';
    closeSheet(); render(); window.scrollTo(0, 0);
  } catch (e) {
    if (ctl.signal.aborted) return;
    const code = e && e.code;
    const msg = code === 'not_granted' ? 'La lecture de la photo n’a pas été autorisée.'
      : code === 'empty' ? 'Aucune recette lisible sur cette photo. Essaie avec une photo plus nette et bien cadrée.'
      : code === 'image_rejected' ? 'Cette image n’a pas pu être lue (format ou taille).'
      : (!code && e && e.message) ? e.message : 'La lecture a échoué. Réessaie dans un instant.';
    const st = $('#ph-st'); if (st) st.textContent = msg; else toast(msg);
    const btn = $('#sheet [data-act="ph-cancel"]'); if (btn) btn.textContent = 'Fermer';
  }
}

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
loadRecipes();
render();
initPhoto();
</script>
